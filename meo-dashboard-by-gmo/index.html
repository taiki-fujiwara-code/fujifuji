<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif; background: #f5f6fa; color: #222; display: flex; height: 100vh; overflow: hidden; }

    border-bottom: 1px solid #2a3050;
  }

  #nav { flex: 1; overflow-y: auto; padding: 8px 0; }
  .nav-item {
    display: block; padding: 9px 16px; font-size: 13px; cursor: pointer;
    color: #9aa3cc; transition: background .15s, color .15s;
    border-left: 3px solid transparent; line-height: 1.4;
  }
  .nav-item:hover { background: #232845; color: #e0e4f4; }
  .nav-item.active { background: #1e2540; color: #7ec8e3; border-left-color: #7ec8e3; font-weight: 600; }
  .nav-item .badge { float: right; font-size: 10px; background: #2a3050; padding: 1px 6px; border-radius: 10px; color: #7b8fcf; }

  /* Main */
  #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #topbar {
    background: #fff; border-bottom: 1px solid #e2e5f0;
    padding: 12px 28px; display: flex; align-items: center; gap: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,.05);

  #topbar h2 { font-size: 17px; color: #1a1e2e; font-weight: 700; flex: 1; }
  #topbar .breadcrumb { font-size: 12px; color: #8892b0; }
  #content-area { flex: 1; overflow-y: auto; padding: 28px 36px; }

  /* Card layout for overview */
  #overview-grid {

  }
  .overview-card:hover { border-color: #7ec8e3; box-shadow: 0 4px 14px rgba(0,0,0,.1); }
  .overview-card .icon { font-size: 28px; margin-bottom: 8px; }
  .overview-card h3 { font-size: 14px; color: #1a1e2e; font-weight: 700; margin-bottom: 4px; }
  .overview-card p { font-size: 12px; color: #8892b0; line-height: 1.5; }
  .overview-card .lines { font-size: 11px; color: #aab; margin-top: 8px; }

  /* Markdown content */
  #md-content {
    background: #fff; border-radius: 12px; padding: 32px 36px;
    box-shadow: 0 1px 6px rgba(0,0,0,.06); max-width: 900px;
  }
  #md-content h1 { font-size: 22px; color: #1a1e2e; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 2px solid #e8ecf8; }
  #md-content h2 { font-size: 17px; color: #2a3670; margin: 28px 0 12px; padding-left: 10px; border-left: 4px solid #7ec8e3; }
  #md-content h3 { font-size: 15px; color: #1a1e2e; margin: 20px 0 8px; }
  #md-content p { line-height: 1.8; color: #333; margin-bottom: 12px; font-size: 14px; }
  #md-content ul, #md-content ol { padding-left: 20px; margin-bottom: 12px; }
  #md-content li { line-height: 1.8; color: #333; font-size: 14px; margin-bottom: 3px; }
  #md-content table { border-collapse: collapse; width: 100%; margin: 16px 0; font-size: 13px; }
  #md-content th { background: #2a3670; color: #fff; padding: 9px 12px; text-align: left; }
  #md-content td { padding: 8px 12px; border: 1px solid #e2e5f0; color: #333; vertical-align: top; }
  #md-content tr:nth-child(even) td { background: #f7f9fd; }
  #md-content blockquote { border-left: 4px solid #f0ad4e; padding: 10px 16px; background: #fffbf0; margin: 12px 0; border-radius: 4px; }
  #md-content code { background: #f0f2f8; padding: 2px 6px; border-radius: 4px; font-size: 12px; color: #c44; }
  #md-content strong { color: #1a1e2e; }
  #md-content hr { border: none; border-top: 1px solid #e8ecf0; margin: 24px 0; }
  #md-content a { color: #4a7fc1; }

  /* Warning/note boxes */
  #md-content p:has(⚠️), #md-content li:has(⚠️) { background: #fff8e1; padding: 8px 12px; border-radius: 6px; border-left: 3px solid #ffc107; }

  #back-btn {
    display: none; cursor: pointer; padding: 6px 14px; background: #f0f2f8;
    border-radius: 6px; font-size: 13px; color: #4a5580; border: 1px solid #dde;
    transition: background .15s;
  }
  #back-btn:hover { background: #e0e4f4; }
</style>

const FILES = {
  "apple-integration.md": "# Apple連携機能（Apple Business Connect連携）\n\n## 情報ソース\n\n| 資料名 | 種別 | 取得日 | 備考 |\n|--------|------|--------|------|\n| MEO Dashboard Apple連携 操作マニュアル | 操作マニュアル | 2026-05-25 | 資料作成日：2026-05-15 |\n| MEO Dashboard Apple連携 リリース共有（5/19） | リリース共有 | 2026-05-25 | リリース日：2026-05-19 |\n\n---\n\n## 機能概要\n\nApple Business Connect（Apple Maps）とのAPI連携機能。MEO Dashboard上からGoogle・Yahoo!と同時にAppleへの情報更新が可能になる。\n\n---\n\n## リリース履歴\n\n| リリース日 | 内容 |\n|-----------|------|\n| 2025-08-27 | ①個店 店舗詳細画面：Apple Business Connectとのアカウント連携 ②個店 店舗基本情報画面の更新（ビジネス名・郵便番号・住所・WEBサイトURL・メインカテゴリー） ③機能設定：Appleアカウント連携開放 |\n| 2025-10-09 | ①個店 店舗詳細画面：Apple Business Connectとのアカウント連携ステータス表示 ②個店 店舗基本情報画面の部分調整（ビジネス名・WEBサイトURLの更新をGoogleと共通化） |\n| 2025-11-20 | 個店 店舗基本情報 ダウンロード機能追加 |\n| 2026-01-13 | ①個店 店舗基本情報 属性 ②個店 写真管理 |\n| 2026-05-15 | グループ 店舗基本情報（8項目追加）※本資料のリリース日 |\n| 2026-05-19 | ①個店 店舗基本情報 Apple8項目追加 ②個店 店舗基本情報 WEBサイトURL：媒体別個別設定が可能に |\n| 今後の予定 | グループ 写真管理、個店・グループ 投稿機能・インサイト情報 |\n\n---\n\n## 機能解放の手順（利用開始前の必須設定）\n\n### 手順の流れ\n\n1. **代理店レベル**でApple機能開放が必要（代理店でONにされていないと会社画面でチェック操作不可）\n2. **会社詳細画面の機能設定**で「Apple Business Connect 連携開放」にチェックを入れ「登録する」\n3. 会社でチェックを入れると、個店の「Apple Business Connect 連携開放」にも自動でチェックが入る\n4. 店舗詳細画面にApple連携ボタンが表示される\n\n### ⚠️ 注意点\n\n会社画面でチェックボックスがON/OFF操作できない場合は、**代理店レベルでのApple機能開放がされていない**可能性がある。代理店への確認が必要。\n\n---\n\n## Apple Business Connectアカウント連携手順（個店）\n\n### 前提\n\n- Apple Business Connect（https://businessconnect.apple.com）のアカウントが必要\n- 事前にApple IDでログインしておく\n\n### 連携手順\n\n1. **Apple Business ConnectにログインABC**\n   - https://businessconnect.apple.com にアクセス\n   - 「サインイン」または「Get Started」を押下\n   - Apple IDとパスワードでサインイン\n\n2. **MEO Dashboard 店舗詳細画面で連携開始**\n   - 店舗詳細画面を開き「Apple Business Connect 連携」セクションまでスクロール\n   - 「Sign in with Apple」ボタンを押下\n   - ※ボタンが表示されない場合は機能開放がされていない可能性（機能解放手順を確認）\n\n3. **会社選択**\n   - Apple Business Connect側で複数会社がある場合、該当会社を選択\n\n4. **再連携確認（過去に連携したことがある場合のみ）**\n   - 「App connected to GMOTECH OAuth App on〜」の確認画面が表示される\n   - 「Reconnect」を押下して次へ進む\n   - ※過去に連携したことがないアカウントにはこの画面は表示されない\n\n5. **ビジネス選択**\n   - ビジネス選択ダイアログが表示される\n   - プルダウンから連携したいビジネスを検索・選択\n   - 「選択する」を押下\n\n6. **連携完了確認**\n   - 店舗詳細画面のApple Business Connect 連携欄に、店舗名・カテゴリ・AppleマップURL・ステータスが表示される\n   - **ステータスが「アクティブ」**になっていれば連携完了・Apple連携機能を利用できる状態\n   - 「詳細」を押下すると店舗基本情報画面に遷移する\n\n---\n\n## 店舗基本情報画面での更新\n\n### 基本操作\n\n- 更新する場合は画面上部の「**Apple**」にチェックを入れて更新する（Google・Yahoo!・Appleを個別に選択可能）\n- Appleに更新できる項目には**りんごマーク（🍎）**が表示されている\n- 更新後、Apple Mapへの反映までに時間がかかるケースがある\n\n### Apple連携可能な項目一覧（2026-05-19時点）\n\n| 項目 | Google共通 / Apple個別 | 備考 |\n|------|----------------------|------|\n| ビジネス名 | Google共通 | Googleと同一入力ボックス。差異がある場合は入力ボックス下に赤字でAppleの現在値を表示 |\n| 郵便番号 | Google共通 | 差異がある場合は入力ボックス下に赤字でAppleの登録情報を表示 |\n| 住所 | Apple個別 | 市区町村・町地名・丁目番地号・ビル名の4ボックスに分かれた専用入力 |\n| WEBサイトURL | **媒体別個別設定**（2026-05-19追加） | Google用とApple用が別ボックス |\n| メインカテゴリー | Apple個別 | プルダウンから設定 |\n| SNSプロフィール | 一部Apple対応（2026-05-19追加） | りんごマークがついているSNSが対象。Facebook・Instagram・X・IOS Apps・Yelp等 |\n| 電話番号 | Apple個別（2026-05-19追加） | Appleマーク付きの電話番号入力ボックス。種別選択（携帯電話番号等）あり |\n| ビジネス情報 | Google共通（2026-05-19追加） | 店舗の簡単な説明。AI翻訳設定あり |\n| 営業ステータス | Apple個別（2026-05-19追加） | 臨時休業・閉業中・営業中から選択。予約更新も可能 |\n| 営業時間 | Google共通（2026-05-19追加） | 曜日別設定 |\n| 特別営業時間 | Apple個別（2026-05-19追加） | 祝日等の特別設定。期間指定あり |\n| サービス別提供時間 | Apple個別（2026-05-19追加） | サービス種別ごとの提供時間。曜日別設定 |\n| 店舗コード | — | （詳細は別途確認） |\n\n### 2026-05-19追加の8項目\n\n①店舗コード ②SNSプロフィール ③電話番号 ④営業ステータス ⑤ビジネス情報 ⑥営業時間 ⑦サービス別提供時間 ⑧特別営業時間\n\n---\n\n## 店舗基本情報 属性（Appleマップ属性）\n\n- 「属性」タブから更新可能\n- 対象媒体をAppleに指定してダウンロード・更新操作\n- 更新後「登録する」を押下\n\nAppleマップ店舗の属性カテゴリ例：\n- アクティビティ（ゴルフコースのホール数等）\n- 共通属性\n- バリアフリー設備（バリアフリーエレベーター・デジタルアクセシビリティ・モビリティスクーター貸出・車いす対応）\n- 年齢制限（18歳以上・16歳以上・21歳以上等）\n- 雰囲気（カジュアル・クラシック・ロマンチック・スポーツ観戦向け・伝統的・トレンディ・高級感）\n\n---\n\n## 写真管理（Apple）\n\n- 写真管理画面の対象媒体で「Apple」を選択して写真を更新\n- 写真更新後、画像右下にAppleマークが表示される\n- 「**Apple処理中**」と表示された場合は管理画面に反映されるまで待つ\n- Apple写真のステータス：処理中 / 投稿拒否 / 投稿済み / 投稿失敗 のいずれか\n- Yahoo!はAPIで投稿日を取得できないため写真の投稿日は表示されない\n- Appleはリアルタイム反映ではない\n\n---\n\n## 店舗基本情報 ダウンロード（個店）\n\n店舗基本情報画面の「ダウンロード」ボタンから店舗基本情報のXLSXファイルをダウンロード可能。\n\n### ダウンロードファイルの構成\n\n**「登録内容シート」**\n- Google・Yahoo!・Apple・食べログの現在の登録内容を媒体別に確認できる\n- Apple連携できない項目、および連携可能だが未登録の項目は「ー」表示\n\n**「改ざん防止・最終更新日シート」**\n- 各項目の改ざん防止ON/OFFと最終更新日を確認できる\n- **Appleは改ざん防止対象外**\n- Apple連携できない項目、および連携可能だが未登録の項目は「ー」表示\n\n---\n\n## ⚠️ 顧客説明・運用上の注意点\n\n- **Apple Mapへの反映には時間がかかる**場合がある。即時反映ではない\n- **ビジネス名・郵便番号はGoogleと共通入力**のため、Apple側だけ変えることはできない。差異がある場合は画面上で確認できる\n- **住所はApple専用ボックス**で4分割入力。Googleの住所入力と形式が異なる\n- **WEBサイトURLは媒体別に個別設定**（2026-05-19以降）。GoogleとAppleで別々のURLを設定できる\n- **機能解放が3段階**（代理店→会社→個店）になっているため、連携ボタンが表示されない場合はどの段階で未解放かを確認する\n- Apple処理中の写真は「Apple処理中」と表示される。処理が完了するまで待つ必要がある\n",

  "coupon-management.md": "# クーポン管理機能\n\n## 情報ソース\n\n| 資料名 | 種別 | 取得日 | 備考 |\n|--------|------|--------|------|\n| MEO Dashboard ヘルプセンター（help-meodash.zendesk.com） | 公式ヘルプ | 2026-06-12 | Claude in Chromeで直接参照 |\n\n---\n\n## 機能概要\n\n実店舗で利用できる割引クーポンの発行・管理を行う機能。\n\n**利用条件：** クーポンの読み取りは、Android端末に専用アプリをインストールして行う仕様。**店舗にAndroid端末がある場合のみ利用可能。**\n\n**効果測定：** クーポン配布総数・利用率などを確認し、マーケティング効果を測定する基礎情報を取得できる。\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/51569189832601\n\n---\n\n## カテゴリ構成\n\n| セクション | 内容 |\n|-----------|------|\n| クーポン 概要 | クーポン機能について |\n| クーポン一覧について | クーポン作成方法・画像サイズ・投稿機能での配布方法 |\n| アプリダウンロードについて | クーポンアプリのダウンロード方法（APKファイル版・QRコード版） |\n\n---\n\n## クーポンの作成\n\nDashboard上でクーポン名・割引内容・有効期限などを設定してクーポンを発行できる。\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/4408477511193\n\n### クーポンの画像サイズ\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/30789098339481\n\n---\n\n## 作成したクーポンを投稿機能で配布する方法\n\n作成したクーポンをGBP投稿機能を使って配布することが可能。\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/4408216495257\n\n---\n\n## クーポンアプリのダウンロード\n\n| 方法 | 説明 |\n|------|------|\n| APKファイルダウンロード版 | Android端末に直接APKファイルをインストール |\n| 二次元バーコード版 | QRコードからダウンロード |\n\n**参照（APK版）**：https://help-meodash.zendesk.com/hc/ja/articles/4408209258265\n**参照（QRコード版）**：https://help-meodash.zendesk.com/hc/ja/articles/4408209220889\n",
  "data-glossary.md": "# 指標・用語定義（MEO Dashboard固有）\n\n## 情報ソース\n\n| 資料名 | 種別 | 取得日 | 備考 |\n|--------|------|--------|------|\n| MEO Dashboard ヘルプセンター（help-meodash.zendesk.com） | 公式ヘルプ | 2026-06-12 | 各機能ヘルプ記事より横断整理 |\n\n---\n\n## インサイト系指標\n\n| 用語 | 定義 | 備考 |\n|------|------|------|\n| **全体閲覧ユーザー数** | GBPが表示されたユーザー数 | 1ユーザー1日1回のユニークカウント |\n| **全体アクション数** | 各アクションボタン（ウェブサイト・ルート・電話）が押された合計回数 | ユニークカウントではない。同一ユーザーの同日複数回も都度カウント |\n| **全体アクション率** | 閲覧ユーザー数に対するアクション発生率 | 全体アクション数 ÷ 全体閲覧ユーザー数 |\n| **ウェブサイトクリック数** | GBP上の「ウェブサイト」ボタンがクリックされた回数 | アクション回数の内訳 |\n| **経路案内クリック数** | GBP上の「経路案内」ボタンがクリックされた回数 | アクション回数の内訳 |\n| **電話ボタンタップ数** | GBP上の「電話」ボタンがタップ/クリックされた回数 | **通話数ではない**。ボタンタップ後にキャンセルしてもカウントされる |\n| **Google予約回数** | 「席を予約」ボタンから予約が完了した回数 | ボタンクリック数はカウント外 |\n| **メニュークリック数** | Googleマップのメニュータブを押した回数 | 飲食店のみ表示。同一ユーザーの複数回は1カウント |\n| **注文回数** | 「注文する」ボタンから注文が完了した回数 | 飲食店のみ表示 |\n| **データ保管期間** | インサイトデータの保管期間 | **18か月**。それ以前のデータは表示不可 |\n\n---\n\n## 順位・KPI系指標\n\n| 用語 | 定義 | 備考 |\n|------|------|------|\n| **3位以内率** | 1ヶ月間において、設定キーワードがGoogle検索の3位以内に入った比率 | 計算式：3位以内に入った回数 ÷（キーワード数 × 日数）|\n| **GBPの検索総数** | 直近1ヶ月のキーワード検索数の合計値 | キーワード分析画面で確認 |\n| **ローカル検索表示なし** | 検索結果にマップ表示がされていない状態 | 特殊ステータス |\n| **競合ナレッジパネル** | 検索結果に競合他社1社のみのナレッジパネルが表示されている状態（マップなし・1社のみ） | 特殊ステータス |\n| **想定来店者数** | アクション数（電話・ルート・ウェブサイト）にGMO TECH独自調査のCV率を乗じた推定値 | **実際の来店者数ではない**。あくまで想定数値・目安 |\n\n---\n\n## クチコミ分析系指標\n\n| 用語 | 定義 | 備考 |\n|------|------|------|\n| **感情分析値** | クチコミに含まれるキーワードの感情分析値 | AWSの感情分析（ポジティブ・ネガティブ）より計算 |\n| **話題数** | キーワードが含まれるクチコミが話題にあがった数 | クチコミ傾向分析で使用 |\n| **評価平均点** | キーワードが含まれるクチコミの評価平均点 | クチコミ傾向分析で使用 |\n| **検出ワード** | キーワードに係る形容詞。検出ワードを含むクチコミの比率も表示 | クチコミ傾向分析で使用 |\n| **ハイライトワード** | GBPのレビュー欄上部に記載されている、レビューで多く含まれているワード | 毎月1日にデータ取得 |\n| **仮登録** | クチコミ傾向分析のキーワードの一時登録。一定期間後に削除される | 継続分析には本登録が必要 |\n| **本登録** | クチコミ傾向分析のキーワードの正式登録。翌朝のバッチ処理後にデータが反映される | — |\n\n---\n\n## データダウンロード系\n\n| 用語 | 定義 | 備考 |\n|------|------|------|\n| **平均値** | 対象インサイト情報の合計 ÷ 指定期間の日数 | 当日を含む期間を指定した場合は直近5日を除いて算出 |\n| **キーワード別ランキングデータ** | 設定キーワードの順位データのCSV出力 | データダウンロード画面から出力 |\n| **パフォーマンスレポートCSV** | インサイトデータのCSV出力 | データダウンロード画面から出力 |\n\n---\n\n## 機能・画面固有の用語\n\n| 用語 | 定義 | 備考 |\n|------|------|------|\n| **改ざん防止機能** | GBPの情報が第三者によって変更された場合、Dashboard登録情報に自動再更新する機能 | 処理タイミング：1日3回（朝/昼/夕方） |\n| **グループ** | 複数店舗をまとめて管理するための単位。一括編集・一括投稿等が可能 | — |\n| **ワークフロー（WF）** | 投稿・クチコミ返信等の承認フロー機能 | — |\n| **多地点順位チェック** | 複数地点からの順位を毎週計測する機能 | 計測日：毎週木曜日 |\n| **インサイトクロス分析** | アクション数と3位以内率を組み合わせて施策効果を分析する画面 | — |\n| **想定来店者数** | インサイトクロス分析内の直近3ヶ月インサイト情報に表示される推定来店者数 | CV率はGMO TECH独自調査値 |\n| **キーワード分析** | 上位表示キーワードの順位推移レポート（店舗ページ限定機能） | 個店のみ |\n| **カレンダー順位レポート** | GBP流入時の検索キーワード順位を1ヶ月単位でカレンダー表示する機能（店舗ページ限定） | 個店のみ |\n| **IPアドレス制限** | 指定IPアドレス以外からのログインを制限する機能 | 要申込。1アカウントにつき最大5IPまで |\n| **MFA（多要素認証）** | ログイン時の二段階認証機能。ID・パスワードに加えて6桁の認証コードが必要 | 要申込。認証コード有効期限10分 |\n",
  "gbp-management.md": "# GBP情報管理機能（店舗基本情報）\n\n## 情報ソース\n\n| 資料名 | 種別 | 取得日 | 備考 |\n|--------|------|--------|------|\n| MEO Dashboard ヘルプセンター（help-meodash.zendesk.com） | 公式ヘルプ | 2026-06-12 | Claude in Chromeで直接参照 |\n\n---\n\n## 機能概要\n\nMEO Dashboard上でGoogleビジネスプロフィール（GBP）の店舗基本情報を編集・管理する機能。\n変更はDashboard → GBPの方向に同期される（GBP上の変更はDashboardに反映されない）。\n\n**アクセス方法（個店）：**\n左メニュー【Googleデータ連携】→【Googleビジネスプロフィール】→【店舗基本情報】\n\n---\n\n## ヘルプカテゴリ「店舗基本情報」の構成\n\n| セクション | 内容 |\n|-----------|------|\n| 個店 | 個店画面での基本情報編集（10記事） |\n| グループ | グループ一括編集（Excelまたは◯☓表）（10記事） |\n| 改ざん防止 | 改ざん防止機能の設定・ログ |\n| その他 | 更新履歴・SNSプロフィール形式・FAQ |\n\n---\n\n## 個店での基本情報編集\n\n### ビジネス情報（概要文）\n\n店舗の簡単な説明文を設定できる項目。\n\n**記載すべき内容（Google公式ガイドラインより）：**\n- 提供している商品やサービス\n- 独自のセールスポイント\n- ビジネスの紹介・由来・歴史\n- ユーザーが参考にできるその他の情報\n\n**記載できない内容：**\n- 特別キャンペーン・特別料金・特典を過度に強調するコンテンツ\n- URLやHTMLコード\n\n**注意事項：**\n- 改行は反映されない\n- 単なるキーワードの羅列は避ける（不自然に入れ込むと悪影響）\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/31275712988825\n\n---\n\n### 営業時間の設定方法\n\n**手順：**\n1. 左メニュー【Googleデータ連携】→【Googleビジネスプロフィール】→【店舗基本情報】を選択\n2. 【営業時間】項目を確認\n3. 設定内容に応じて以下を入力：\n   - 営業中時間を登録する場合：【営業】にチェックを入れ、開店・閉店時間を入力\n   - 定休日を登録する場合：【定休日】にチェックを入れる\n   - 24時間営業の場合（ホテル等）：【24時間営業】にチェックを入れる\n4. 画面下部の【登録する】を押して完了\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/31077967746073\n\n---\n\n### 特別営業時間の設定方法\n\n大型連休・年末年始など、通常の営業日・定休日と異なる営業時間を設定する機能。\n\n**手順（個店）：**\n1. 左メニュー【Googleデータ連携】→【Googleビジネスプロフィール】→【店舗基本情報】を選択\n2. 営業時間設定箇所の下部にある【特別営業時間】から設定\n\n**定休日を設定したい場合：**\n- 日付を選択し、スライダーを青にする。時間入力は空白のままでOK\n\n**営業日を設定したい場合：**\n- 日付と時間を入力し、スライダーを青にする\n\n**日をまたぐ場合：** 2日間に分けて登録\n- 例）2024/12/28 12:00 00:00、2024/12/29 00:00 02:00\n\n**一括登録（個店・グループ共通）：**\n1. 「一括追加」を選択\n2. 日付と時間を設定し保存ボタンを押下\n3. 画面下部の【登録する】を押下\n\n**削除方法：** スライダーをON（青）にし、脇の「✕」を押す\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/4408216066457\n\n---\n\n### 臨時休業の掲載方法\n\n**適用ケース：** 連続して7日間以上休業する場合、または期間不明で休業する場合は臨時休業に変更する。\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/4408634087449\n\n---\n\n### サービスの追加方法\n\n店舗で実施しているサービス名と詳細を表示できる項目。\n\n⚠️ **スマートフォンのみで表示。パソコンでは表示されない。**\n\n**手順：**\n1. 左メニュー【Googleデータ連携】→【Googleビジネスプロフィール】→【店舗基本情報】→【サービス】を選択\n2. 各項目の編集：\n   - ①：メインカテゴリー・サブカテゴリーが表示される。各カテゴリーの下にサービスを追加可能\n   - ②：【鉛筆マーク】または【追加】からサービス名と詳細を入力\n   - ③：Googleが自動提示するサービス候補から選択も可能\n3. 【登録する】を押して完了\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/37549749732249\n\n---\n\n### SNSプロフィールの設定\n\n個店・グループ共に【店舗基本情報】よりSNSプロフィールの設定が可能。\n\n**各SNSのURL記載形式：**\n\n| SNS | URL形式 |\n|-----|---------|\n| Facebook | https://www.facebook.com/{ユーザー名} |\n| Instagram | https://www.instagram.com/{ユーザー名} |\n| LinkedIn | https://www.linkedin.com/in/{ユーザー名} または /company/{ユーザー名} |\n| Pinterest | https://www.pinterest.com/{ユーザー名} |\n| TikTok | https://www.tiktok.com/{ユーザー名} |\n| X（旧Twitter） | https://www.twitter.com/{ユーザー名} |\n| YouTube | https://www.youtube.com/channel/{ユーザー名} 等 |\n\n**Googleが自動登録したSNSの削除：**\nGoogleに削除申請が必要。対象GBPの管理権限を持つGoogleアカウントでログインの上、以下URLより申請。\nhttps://support.google.com/business/gethelp\n※削除までにはお時間がかかる場合あり\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/33452890249369\n\n---\n\n### 【ホテル】店舗基本情報の編集（個店）\n\nホテルカテゴリーの店舗では、通常の店舗基本情報に加えて「ホテル店舗基本情報」タブが表示される。\n\n**ホテル専用編集項目：**\n\n| 項目 | 入力形式 |\n|------|---------|\n| A：ホテル名 | 店舗名表示 |\n| B：ビジネス名 | GBP登録ビジネス名 |\n| C：最終改装年 | 西暦4桁・半角数値 |\n| D：客室数 | 半角数値 |\n| E：階数 | 半角数値 |\n| F：チェックイン・チェックアウト時間 | 00:01〜23:59。例：15:00 |\n| G：最大子供年齢 | 子供料金で宿泊できる年齢 |\n| H：子供宿泊無料枠の上限数 | 1世帯あたりの上限 |\n| I：子供無料宿泊 | 無料の場合はボタンを選択 |\n| J：ダウンロード | 登録情報のダウンロード |\n\n**注意：** ホテル基本情報画面でのチェックボックスON→OFF変更は直接不可。変更は一括インポートファイルにて対応。\n\n**対象となるホテル・旅館等（Googleのホテル物件）：**\nホテル・モーテル・ホステル・リゾートホテル・山小屋・キャンプ場＆コテージ・長期滞在型ホテル・ラブホテル・イン・B&B・ファームステイ・旅館・カプセルホテル・宗教宿泊施設・民宿 等\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/52947603688601\n\n---\n\n## グループでの一括編集\n\n### 一括編集（Excel）\n\nグループ単位でGBP店舗基本情報をExcelで一括設定・編集できる。\n\n**手順：**\n1. MEO DashboardロゴのHm横の店舗名クリック→グループ→任意のグループ選択\n2. 左メニュー【Googleデータ連携】→【Googleビジネスプロフィール】→【店舗基本情報】\n3. 【ダウンロード】→【グループ一括登録テンプレート】を選択\n4. 【ダウンロード・インポート処理管理】画面からExcelをダウンロード\n5. Excelを編集（GoogleシートとYahoo!シートに分かれている）\n   - Google情報更新：【(Google)店舗基本情報】シートのE列【更新媒体】を「Google」で設定\n   - Yahoo!情報更新：【(Yahoo!)店舗基本情報】シートのE列を「Yahoo!」で設定\n   - 両方同時：両シートを更新しE列を「Google・Yahoo!」で設定\n6. DashboardでExcelをインポートして完了\n\n**特別営業時間の記載方法（Excel）：**\n- 定休日：`2023/11/06 定休日、2023/11/07 定休日`（「、」区切り）\n- 営業時間：`2023/11/06 11:00 20:00、2023/11/07 12:00 19:00`\n- 日をまたぐ場合：`2024/12/28 12:00 00:00、2024/12/29 00:00 01:00`\n- スペースは半角。時刻間に文字・記号不要（半角スペースのみ）\n\n⚠️ **誤って情報を削除しセルが空白のままインポートした場合、情報が削除される。**\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/29604184006425\n\n---\n\n## 改ざん防止機能\n\noverview.md に収録済み。詳細は `references/overview.md` の「改ざん防止機能」セクションを参照。\n\n---\n\n## その他FAQ\n\n### 閉業時の対応\n閉業した店舗は Dashboard から「閉業」ステータスへ変更する。\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/4408633968153\n\n### GBP上で基本情報を編集してもDashboardに反映されない\nDashboard → GBPへの同期は行われるが、GBP → Dashboardへの同期はGoogleの仕様上存在しない。基本情報の変更は必ずDashboard上から行う。\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/5633688946713\n\n### テイクアウト・宅配等の営業時間設定\nテイクアウトや宅配等の副次的な営業時間も設定可能。\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/4408642257817\n\n### 店舗基本情報 更新履歴\nDashboard上での基本情報変更履歴を確認できる機能。\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/47789711305113\n",
  "google-about.md": "# Googleについて（オーナー権限・GBP関連）\n\n## 情報ソース\n\n| 資料名 | 種別 | 取得日 | 備考 |\n|--------|------|--------|------|\n| MEO Dashboard ヘルプセンター（help-meodash.zendesk.com） | 公式ヘルプ | 2026-06-12 | Claude in Chromeで直接参照 |\n\n---\n\n## カテゴリ構成\n\n| セクション | 記事数 | 主な内容 |\n|-----------|--------|---------|\n| オーナー権限について | 22記事 | オーナー確認方法・権限の種類・譲渡・重複ステータス・審査中対応 |\n| Googleビジネスプロフィールについて | 33記事 | GBP管理・言語設定・予約ボタン・クチコミ反映 |\n| その他 | 8記事 | リスティング停止・問い合わせ方法・クチコミ削除対策 |\n\n---\n\n## GBPの「オーナー」「管理者」の違い\n\n**違いのポイント：** リスティングの削除権限・ユーザー管理権限の有無。\n\n| 権限 | オーナー | 管理者 |\n|------|---------|--------|\n| ビジネス情報の編集 | ✅ | ✅ |\n| 写真・動画の追加 | ✅ | ✅ |\n| 投稿の作成・管理 | ✅ | ✅ |\n| クチコミへの返信 | ✅ | ✅ |\n| インサイトの確認 | ✅ | ✅ |\n| 他ユーザーの招待・承認・削除 | ✅ | ❌ |\n| ビジネスプロフィールの削除 | ✅ | ❌ |\n| オーナー権限の譲渡 | ✅ | ❌ |\n\n⚠️ オーナー権限を持つ人が退職・異動する場合は速やかに新しいオーナーを任命し権限を譲渡する必要がある。\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/4408644997785\n\n---\n\n## GBPのステータスの種類\n\n| ステータス | 意味 |\n|-----------|------|\n| **確認済み** | オーナー確認が完了し、Googleにビジネス情報が公開されている状態 |\n| **重複** | 同一住所・同一ビジネス情報が複数登録されていると自動判断された状態 |\n| **オーナー確認が必要** | ビジネス登録はできているが、オーナー確認の方法をまだ選択していない状態 |\n| **停止中** | ビジネスプロフィールが公開停止。Googleマップ・検索結果に表示されなくなる |\n\n### 「停止中」の主な原因と解決策\n\n**原因：** ガイドライン違反（虚偽情報・禁止キーワード使用等）/ 不正な口コミ投稿等の不正活動 / アカウントの制限\n\n**解決策：**\n1. 停止の原因となっているガイドライン違反を修正\n2. 違反修正後、Googleに回復リクエストを提出\n3. 回復リクエストが却下された場合は再審査請求を行う\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/47722280624153\n\n---\n\n## オーナー確認の方法\n\n### 1〜10店舗の場合\n\n**① ハガキによる確認（最も一般的）**\n\n1. GBPにログインし、オーナー確認が必要なビジネスを選択\n2. 「オーナー確認を行う」または「今すぐオーナー確認」をクリック\n3. 提示された方法から「郵送」または「ハガキ」を選択\n4. 連絡先の名前を入力し、郵送先住所を確認してリクエストを送信\n5. 2〜3週間程度で確認コード記載のハガキが届く\n6. GBPにログインし、ハガキに記載された確認コードを入力して完了\n\n⚠️ ハガキが届くまでの間、ビジネス名・カテゴリ・住所などの編集は避ける。編集すると申請が無効になる場合がある。\n\n**② 電話・SMSによる確認**\n\n1. GBPで「オーナー確認を行う」をクリック\n2. 「電話」または「SMS」が表示された場合に選択\n3. 登録電話番号に確認コードが届く（自動音声またはSMS）\n4. 確認コードを入力して完了\n\n⚠️ フリーダイヤル（0120）や自動音声応答システム（IVR）を利用している電話番号では確認できない場合がある。\n\n**③ 動画による確認**\n\n1. GBPで「動画による確認」を選択\n2. スマートフォンで以下を撮影して提出：\n   - ビジネスの外観（通り名・店舗名・サインなど）\n   - 内装\n   - ブランド名入り設備での営業活動の様子\n   - レジやキッチンなどの運営場所\n3. Googleが審査し、通常5営業日以内に結果が通知される\n\n### 10店舗以上の場合\n\n一括申請が可能。スプレッドシートを作成してGoogleへ一括確認をリクエストする。\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/4408637250969\n\n---\n\n## 審査中のまま進まない場合\n\nオーナー確認が「審査中」のまま進まない場合の対処法。\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/57461838689177\n\n---\n\n## オーナー権限の譲渡手順\n\n1. GBP管理画面を開く\n2. 「その他アイコン」（縦3点）→「ビジネスプロフィールの設定」を選択\n3. 「ユーザーとアクセス権」を選ぶ\n4. 譲渡したいユーザーを選択\n5. 編集アイコン（鉛筆マーク）をクリックし「メインのオーナー」を選択して「保存」\n\n⚠️ この操作は現在のメインオーナー権限を持つユーザーのみが行える。新しいオーナーは事前に招待を受け入れアクセス権が付与されている必要がある。\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/4408686764825\n\n---\n\n## 権限譲渡後の「7日間制限」\n\nGBPにおける権限譲渡後は7日間の制限期間がある（詳細は記事参照）。\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/56799453064857\n\n---\n\n## 重複ステータスの対応方法\n\n### 対応方法①：アクセス権限リクエスト\n\n「このビジネスのプロフィールはすでにGoogleに登録されています。管理者になるためのアクセスをリクエストできます。」と表示されている場合。\n\n1. 「アクセス権限をリクエスト」をクリック\n2. 指示に従いリクエストを送信\n3. 既存管理者が承認するか、Googleが手動で確認（通常3〜7日）\n\n⚠️ 管理者がリクエストに応じない場合、Googleから「ビジネスオーナー確認のための証拠の提出」を求められることがある。\n\n### 対応方法②：コピーを削除\n\n「既存のプロフィールを管理するためのリクエストは承認されました。ビジネスプロフィールからこのコピーを削除できます。」と表示されている場合。\n\n1. 管理画面で「︙」→「ビジネスプロフィールの設定」を押下\n2. 「プロフィールのコンテンツと管理者の削除」を押下\n3. 「続行」→「削除」を押下\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/4408716965017\n\n---\n\n## 心当たりのないオーナー権限リクエストが届いた場合\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/55282032153753\n\n### 知らないアカウントから「オーナー権限リクエスト」がメールで届く理由\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/4408687217049\n\n---\n\n## オーナー権限を取得しているアカウントの確認方法\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/30330107874585\n\n---\n\n## 管理者の追加・削除\n\n### 管理者を追加する方法\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/4408637971737\n\n### 管理者を削除する方法\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/4408710595609\n\n---\n\n## GBP関連FAQ\n\n### クチコミが反映されないケース\n\nGBPに投稿されたクチコミが反映されない場合の原因。\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/58260497284889\n\n### クチコミをGoogleに削除されないための対策\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/58260022272921\n\n### Googleに「違反・スパム」と疑われるクチコミの具体的トリガー\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/58259464263705\n\n### GBPについてGoogleへ問い合わせる方法\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/55140392071833\n\n### リスティングが停止した時の対処方法\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/4408826500121\n\n### 「オンラインで予約」ボタンが表示されないケース\n\n- 予約システム・プロバイダの影響：https://help-meodash.zendesk.com/hc/ja/articles/56975661087129\n- カテゴリの影響：https://help-meodash.zendesk.com/hc/ja/articles/56973028730009\n",
  "group-management.md": "# グループ管理機能\n\n## 情報ソース\n\n| 資料名 | 種別 | 取得日 | 備考 |\n|--------|------|--------|------|\n| MEO Dashboard ヘルプセンター（help-meodash.zendesk.com） | 公式ヘルプ | 2026-06-12 | Claude in Chromeで直接参照 |\n\n---\n\n## グループ管理カテゴリの構成\n\n| セクション | 内容 |\n|-----------|------|\n| 任意グループ比較 | 任意店舗を選択してインサイトを比較する機能 |\n| グループ新規作成 | グループ作成・店舗の追加変更・上限数 |\n| プロモーションメニューについて | グループ管理を利用したクーポン作成 |\n| データダウンロードについて（グループ管理） | 店舗別インサイトデータのダウンロード |\n| Googleマイビジネスについて（グループ管理） | 投稿一覧 |\n\n---\n\n## 任意グループ比較機能\n\n選択した複数店舗のインサイトを、都道府県・エリア平均値と比較できる機能。\n\n**比較対象：** 最大5店舗まで選択可能\n\n### 使用手順\n\n1. Dashboardにログイン\n2. 上部メニューから【グループ管理】→【任意グループ比較】を選択\n3. 左上「比較する期間」で比較期間を設定\n4. 比較対象店舗を最大5つまで選択（3つの選択方法）：\n   - ①日本地図から都道府県をクリックして店舗を選択\n   - ②フリーワード検索ボックスで店舗名を検索して選択\n   - ③店舗リストから選択\n5. 「この条件で比較」をクリックしてグラフ表示\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/5074087629337\n\n---\n\n## グループの作成・設定\n\n### 新規グループ登録\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/4408213592217\n**参照（一括登録）**：https://help-meodash.zendesk.com/hc/ja/articles/54891061212825\n\n### グループに登録した店舗の変更\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/4408484982937\n\n### グループ作成の上限数\n\nグループ作成には上限数がある（詳細は上記参照記事を確認）。\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/4408209464729\n\n---\n\n## グループ管理を利用したデータダウンロード\n\nグループ管理画面からの店舗別インサイトデータダウンロードについては `references/analytics-report.md` も参照。\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/4408402764697\n",
  "hp-faq-management.md": "# HP FAQ管理機能\n\n## 情報ソース\n\n| 資料名 | 種別 | 取得日 | 備考 |\n|--------|------|--------|------|\n| MEO Dashboard HP FAQ管理機能 操作マニュアル | 操作マニュアル | 2026-05-21 | リリース予定：2026-05-26 |\n| MEO Dashboard 新機能「HP FAQ管理」リリース告知 | 追加機能告知 | 2026-05-25 | リリース予定：2026-05-26 |\n| MEO Dashboard ヘルプセンター「HP FAQ管理機能」記事 | 公式ヘルプ | 2026-06-05 | https://help-meodash.zendesk.com/hc/ja/articles/58335334204825 |\n\n---\n\n## 機能概要\n\nMEO Dashboardで管理しているFAQ情報をWebサイトへ連携表示する機能。管理画面から発行した専用タグをWebサイトの対象ページに設置するだけで、FAQコンテンツが自動表示される。\n\n**開発背景**：GBPの仕様変更でFAQ（Q&A）をオーナーが編集できなくなった現在、ホームページ上にFAQを用意しておくことは集客・信頼構築において非常に重要。MEO Dashboard上での一元管理＋ワンタグ実装により、運用効率化と情報更新の最適化を実現。店舗サイトのFAQはWebサイト側で個別管理されるケースが多く、更新作業・情報管理の負荷が課題だった。\n\n**リリース日**：2026-05-26\n\n---\n\n## 対象画面\n\n| 画面 | 新設 / 改修 |\n|------|------------|\n| 個店 HP FAQ管理 | 【新設】 |\n| グループ HP FAQ管理 | 【新設】 |\n| 会社および店舗 機能設定 | 【改修】 |\n\n---\n\n## 機能解放の手順（利用開始前の必須設定）\n\nHP FAQ管理機能を利用するには、会社・店舗の両方で機能解放が必要。\n\n### 会社の機能設定\n\n- 個店用と**グループ用の2箇所**にチェックボックスがある\n- 両方を解放する場合はそれぞれチェックが必要\n\n会社の機能設定画面で確認できる主な機能一覧（Googleビジネスプロフィール欄）：\n\n| 機能名 | 初期状態の目安 |\n|--------|--------------|\n| ダッシュボード | ✅ |\n| 店舗基本情報更新（改ざん防止機能付） | ✅ |\n| 飲食店メニュー | ✅ |\n| HP連携（JS・PHP） | ✅ |\n| 写真管理 | ✅ |\n| 投稿（最新情報・投稿・イベント） | ✅ |\n| SNS投稿（最新情報・投稿・イベント） | ✅ |\n| AI投稿（最新情報・投稿・イベント） | ✅ |\n| HP投稿連携 | □（要解放） |\n| **HP FAQ管理** | □（要解放） |\n| ワークフロー承認機能（各店舗用） | ✅ |\n| クチコミ管理（個別返信・一括インポート返信・自動返信） | ✅ |\n| AIクチコミ返信アシスタント | ✅ |\n| クチコミ分析 | ✅ |\n| クチコミ評価要約 | ✅ |\n| FAQ管理 | ✅ |\n| 構造化データ作成（入力フォーム・JSON出力） | ✅ |\n| AI翻訳 | ✅ |\n\nグループ管理欄にも同様に「HP FAQ管理」チェックボックスあり。\n\n### 店舗の機能設定\n\n- 店舗の機能画面で「HP FAQ管理」のチェックを入れて機能解放する\n- 会社設定での解放に加えて、店舗単位での解放も必要\n\n---\n\n## 個店 HP FAQ管理\n\n### FAQ登録・編集（「FAQ登録・更新」タブ）\n\n| 項目 | 説明 | 制限 |\n|------|------|------|\n| A：FAQ表示順序 | ドラッグ＆ドロップで並び順を変更 | — |\n| B：質問 | 質問テキストを入力 | 最大100文字 |\n| C：回答 | 回答テキストを入力 | 最大300文字 |\n| D：質問の追加 | 「＋質問を追加」ボタンで質問を追加 | — |\n| E：登録する | 全項目更新後に押下して保存 | — |\n\n**操作の流れ**：質問・回答を入力 → 必要に応じて「質問の追加」で追加 → 「登録する」で保存\n\n### デザイン設定とタグ発行（「デザイン・タグ発行」タブ）\n\nWebサイトに埋め込むFAQのデザインを設定し、タグを発行する。\n\n| 項目 | 説明 |\n|------|------|\n| A：タイトル指定 | 質問のタイトルを指定あり・指定なしで設定。タイトルは最大20文字 |\n| B：デザイン選択 | **ライン型・カード型・シンプル型**の3種類から選択 |\n| C：境界選択 | 見出しとFAQエリアの境界線あり・なしを設定 |\n| D：QAマークの設定 | 質問・回答にQAマークを表示するか設定 |\n| E：タイトルテキスト | タイトルのテキストカラーを設定 |\n| F：各種カラー設定 | 質問テキスト・質問背景色・回答テキスト・回答背景色を設定 |\n| G：フォントサイズ | タイトル・質問・回答のフォントサイズを設定 |\n| H：デザインイメージ | A〜Gの設定のプレビューを確認できる |\n| I：発行する | タグを発行するボタン |\n| J：タグ | コピーしてWebサイトの `<body>` タグ内の表示したい箇所に貼り付け |\n\n**操作の流れ**：デザイン設定 → プレビューで確認 → 「発行する」でタグ発行 → タグをコピーしてWebサイトに貼り付け\n\n---\n\n## グループ HP FAQ管理\n\nグループ画面では**FAQの登録のみ**が可能（デザイン設定は個店画面で行う）。\n\n### 操作手順\n\n1. 「ダウンロード」ボタンでテンプレートファイル（Excel）を出力\n2. ダウンロードしたExcelファイルを編集（FAQ内容を入力・更新）\n3. 「一括インポート」でファイルをアップロード\n\n---\n\n## 顧客説明のポイント\n\n**「FAQをWebサイトに自動表示したい」という要望への回答：**\nHP FAQ管理機能を使えばMEO Dashboard上でFAQ内容を管理し、専用タグを貼り付けるだけで自動反映される。WebサイトのHTML改修不要で、Dashboard側の更新がそのままWebに反映される。\n\n**「複数店舗にFAQを設定したい」という要望への回答：**\nグループ HP FAQ管理からExcelテンプレートを使った一括インポートが可能。\n\n**「デザインをカスタマイズしたい」という要望への回答：**\nライン型・カード型・シンプル型の3種類から選択でき、カラー・フォントサイズも調整可能。\n\n**⚠️ 注意点：機能解放が必要**\n利用開始前に会社設定・店舗設定の両方でHP FAQ管理のチェックボックスをONにする必要がある。片方だけでは機能が使えない。\n",
  "initial-setup.md": "# 初期設定\n\n## 情報ソース\n\n| 資料名 | 種別 | 取得日 | 備考 |\n|--------|------|--------|------|\n| MEO Dashboard ヘルプセンター（help-meodash.zendesk.com） | 公式ヘルプ | 2026-06-12 | Claude in Chromeで直接参照 |\n\n---\n\n## 初期設定カテゴリの構成\n\n| セクション | 内容 |\n|-----------|------|\n| GBPの連携方法 | 新規連携・再連携・ステータス確認・GBP情報反映（9記事） |\n| ユーザー追加の方法 | マスターアカウント登録・ユーザー作成・一括追加・役割設定（11記事） |\n| グループの作成方法 | 新規グループ登録・店舗変更・上限数 |\n| 順位計測のエリア・キーワード設定方法 | キーワード設定・一括設定・検索エリア・変更方法 |\n| Googleアナリティクス（GA4）について | GA4連携・キャンペーンURL生成 |\n| その他 | Yext連携初期対応・パスワード関連 |\n\n---\n\n## GBP連携のステータス\n\n店舗管理画面でGBPとDashboardの連携状況を確認できる。3種類のステータスが存在する。\n\n| ステータス | 状態 | 対処法 |\n|-----------|------|--------|\n| **有** | DashboardとGBPが正常に連携できている | そのまま利用可 |\n| **無** | DashboardとGBPが連携できていない | GBP連携方法または再連携方法を参照 |\n| **非アクティブ** | システムがGoogleにアクセスしようとしても反応がない（GBPを管理していたGoogleアカウントが削除・停止された等） | 再連携方法を参照 |\n\n**確認方法：** ダッシュボード右上ビルマーク →【設定】→【会社】→ 会社名選択 → 下部スクロールでGBP連携ステータスを確認\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/54383269923225\n\n---\n\n## GBPステータス（オーナー確認状況）\n\nGBPステータスはオーナー権限の確認状況を示す。「確認済み」でない場合、インサイト・クチコミ・投稿・写真情報が反映されない可能性がある。\n\n| ステータス | 状態 | 対処法 |\n|-----------|------|--------|\n| **確認済み** | Googleが実在・オーナー管理を認めた正常な状態 | 全機能利用可 |\n| **未確認** | オーナー確認が未完了、またはガイドライン違反の疑いがある状態 | 確認手続きを完了、またはガイドライン修正後に回復リクエストを送る |\n| **ー（ハイフン）** | 情報が取得できていない状態 | 担当者に連絡 |\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/54382955285529\n\n---\n\n## キーワード・検索エリアの設定方法\n\n### 個店へのキーワード設定手順\n\n1. 管理画面トップページ右上アイコンをクリック\n2. 【設定】→【店舗】の順にクリック\n3. 設定したい店舗名で検索 → 店舗名を選択\n4. 【店舗情報】下部の【エリアごとのキーワード設定(Google)】までスクロール\n5. 「＋検索エリア追加」をクリック\n6. 検索エリアを設定：\n   - STEP1：計測地点名を入力（店舗のある市区町村エリアでの計測を推奨）\n   - STEP2：管理名称を入力\n   - 「登録する」をクリック\n7. 「キーワード」欄にキーワードを入力\n8. 「＋キーワード追加」で同地点の追加キーワードを入力、「＋検索エリア追加」で別地点を追加\n9. ページ最下部の「登録する」をクリックして完了\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/28168174812313\n\n---\n\n## Googleアナリティクス（GA4）連携\n\n### 連携手順\n\n1. MEO DashboardにログインHm後、画面右上【🏨】→【設定】→【店舗】から店舗一覧を表示\n2. 連携させたい店舗名を選択\n3. 店舗詳細ページ中央の「GoogleAnalytics連携」の「Sign in with Google（GA4）」をクリック\n4. 連携したい店舗に紐づくGoogleアカウントを選択\n5. アクセス許可画面で「許可」または「continue」を選択\n   - ⚠️「このアプリはGoogleで認識されていません」が表示された場合は「詳細」→「MEO Dash！byGMOに移動」をクリック\n6. MEO Dashboard画面に戻り、「アナリティクスアカウント名」を選択\n7. 「アプリ名（コンテンツ名）」を選択\n8. 「選択する」をクリックして登録完了\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/4408213563673\n\n---\n\n## グループの作成・管理\n\n### 新規グループ登録手順\n\n左メニューまたは設定画面からグループを新規作成可能。\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/4408213592217\n\n### グループの上限数\n\nグループ作成には上限数がある。\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/4408209464729\n\n---\n\n## ユーザーアカウント管理\n\n5種類の役割については `references/overview.md` を参照。\n\n### マスターアカウントの登録手順\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/10999609577369\n\n### ユーザーアカウントの一括追加\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/30741226844057\n",
  "photo-post-review.md": "# 写真管理・投稿・クチコミ返信\n\n## 情報ソース\n\n| 資料名 | 種別 | 取得日 | 備考 |\n|--------|------|--------|------|\n| MEO Dashboard ヘルプセンター（help-meodash.zendesk.com） | 公式ヘルプ | 2026-06-04 | Claude in Chromeで直接参照 |\n| MEO Dashboard ヘルプセンター（help-meodash.zendesk.com） | 公式ヘルプ | 2026-06-12 | 写真管理カテゴリ 追加取得 |\n\n---\n\n## 写真管理カテゴリの構成\n\n| セクション | 内容 |\n|-----------|------|\n| 個店 | 写真の追加（GBPのみ連携中・Yahoo!連携後）・削除方法 |\n| グループ | 写真の追加（画面登録・一括登録）・削除方法 |\n| その他 | 推奨サイズ・ロゴ/カバー写真・ユーザー投稿写真削除・写真予約（9記事） |\n\n---\n\n## 写真管理\n\n### 個店：写真の追加手順（GBP連携のみの場合）\n\n1. 左メニュー【Googleデータ連携】→【Googleビジネスプロフィール】→【写真管理】を選択\n2. 【+新規登録】をクリック\n3. カテゴリー選択から該当カテゴリを選択し【選択する】をクリック（該当なければそのまま【登録する】）\n4. アップロードしたい画像を【ファイルを選択】から選択 or ドラッグ＆ドロップ（複数枚同時可）\n5. 読み込み完了（くるくるが消える）で登録完了\n\n⚠️ メインカテゴリーにより追加できないカテゴリーがある。その場合はエラーが表示されるので別のカテゴリーを選択する。\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/30654080487577\n\n⚠️ メインカテゴリーにより追加できないカテゴリーがある。その場合はエラーが表示されるので別カテゴリーを選択する。\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/30654080487577\n\n### 画像・動画の推奨サイズ\n\n**静止画（共通）**\n\n| 項目 | 仕様 |\n|------|------|\n| 形式 | JPG または PNG |\n| ファイルサイズ | 10KB〜5MB |\n| 推奨解像度 | 縦720px × 横720px |\n| 最小解像度 | 縦250px × 横250px |\n| 最大解像度 | 縦10,000px × 横10,000px |\n\n**ロゴ画像**\n\n| 項目 | 仕様 |\n|------|------|\n| 最小解像度 | 縦200px × 横200px |\n| 最大解像度 | 縦20,000px × 横20,000px |\n\n**カバー画像**\n\n| 項目 | 仕様 |\n|------|------|\n| 最小解像度 | 縦216px × 横384px |\n| 最大解像度 | 縦1,430px × 横2,544px |\n\n**動画（GBP）**\n\n| 項目 | 仕様 |\n|------|------|\n| 時間 | 最大30秒 |\n| ファイルサイズ | 最大25MB（Dashboard経由も同様） |\n| 解像度 | 720p以上（一般的に1280×720px） |\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/30831493754649\n\n### 写真管理画面の構成\n\n| セクション | 内容 |\n|-----------|------|\n| 個店 | 写真の追加・削除（GBP連携のみ / Yahoo!連携後） |\n| グループ | 写真の一括追加・削除 |\n| その他 | ユーザー投稿写真の削除申請・写真予約・ロゴ/カバー写真設定 |\n\n---\n\n## 投稿機能\n\n### 投稿の種類\n\n| 種類 | 概要 |\n|------|------|\n| 最新情報 | どんな情報にも使えるシンプルなフォーマット |\n| 特典 | タイトル・クーポンコード・特典リンクなどを設定可能 |\n| イベント | タイトル・開催期間などを設定可能 |\n\n### 個店：投稿手順\n\n1. 左メニュー【Googleデータ連携】→【Googleビジネスプロフィール】→【投稿】を選択\n2. 【新規投稿】をクリック\n3. 投稿の種類を選択（最新情報・特典・イベント）\n4. 必要項目を設定：\n   - **投稿日時**：即時投稿 or 予約投稿（翌日以降の日時指定）\n   - **投稿内容**：文章（AI作成も可能）\n   - **画像**：イベントバナー・商品画像等（AI生成も可能）\n   - **ボタンの追加**：詳細ページへのリンクボタン\n   - **ハッシュタグ**：主にSNS連携投稿時に使用\n   - **ワークフロー申請**：他者に確認してもらう場合\n5. 右側の投稿イメージで内容確認\n6. 【登録する】をクリックで投稿完了\n\n⚠️ システムの関係上、**1時間以内の連続投稿はお控えください**。\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/31057211107481\n\n### 投稿の編集・削除\n\n- 編集：詳細下の編集マークを押下 → 修正 → 「登録」\n- 削除：画面下部の「投稿内容を削除」を選択\n\n### グループ投稿\n\n- **一括投稿**：グループ管理画面から全店舗共通 or 店舗ごとに内容を変えた一括投稿が可能\n- **Excelインポート**：Excelファイルを使用した投稿も可能\n\n---\n\n## クチコミ返信\n\n### Dashboardへのクチコミ反映タイミング\n\n**新規連携時：**\n連携した日の23:30に全クチコミを取得 → 翌日Dashboardに反映\n\n**連携後の定期処理：**\n\n| 処理 | タイミング |\n|------|-----------|\n| 全クチコミ一括取得 | 月1回（1店舗1回）ランダム。バッチ実行日は10日〜25日 |\n| 差分取得＋自動返信 | 毎日6回（5時・8時・11時・14時・17時・20時）3時間おき |\n| 夜間補完チェック | 毎日23:30にDashboardとGBPのクチコミ件数を比較し、不足があれば全取得（自動返信は行わない） |\n\n**各バッチの詳細：**\n- **5時バッチ**：前日20時〜当日5時のクチコミ取得＋自動返信処理\n- **8〜20時バッチ**：3時間前のクチコミ取得＋自動返信処理\n- **20時バッチ**：当日自動返信できなかったクチコミへの自動返信も実行\n\n⚠️ バッチ処理時間は目安。反映までにラグが生じる可能性あり。\n\n**手動取得（全クチコミ取得ボタン）：**\nクリック回数制限なし。GBP上で返信を行い、Dashboard上にデータがない場合などに活用。\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/21007623734809\n\n### クチコミ自動返信（個店）\n\n**概要**：設定した条件（★の数・コメントの有無等）に合致するクチコミが投稿された際に自動でコメント返信する機能。\n\n**設定手順：**\n1. 【Googleビジネスプロフィール】→【クチコミ管理】を開き、「返信パターン・自動返信」をクリック\n2. 各項目を選択/入力し、返信パターンを登録\n3. 「自動返信」にチェックを入れる\n\n**自動返信の処理タイミング**：毎日10時〜22時の間、**2時間おき**に処理\n\n⚠️ 返信パターンの登録のみ行いたい場合は、「自動返信」のチェックを外す。\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/18103444215193\n\n### クチコミ返信機能の全体構成\n\n| 機能 | 個店 | グループ |\n|------|------|---------|\n| 一括返信 | ✅ | ✅ |\n| 自動返信 | ✅（設定・削除） | ✅（設定・削除） |\n| 返信テンプレート | ✅ | ✅ |\n| AI返信アシスタント | ✅（β版・ChatGPT API） | ✅ |\n| AI翻訳 | ✅ | ✅ |\n\n### その他のクチコミ管理機能\n\n| 機能 | 概要 |\n|------|------|\n| ★でソート | クチコミの星の数でソートをかけられる |\n| クチコミ投稿通知 | 新着クチコミの通知設定 |\n| 削除申請 | Googleビジネスプロフィールのクチコミ削除申請の手順 |\n\n---\n\n## ワークフロー機能\n\n### 概要\n\nクチコミ返信と投稿をワークフロー申請（承認フロー）で行う機能。\n\n### フロー\n\n1. **投稿作成**：担当者が投稿やクチコミ返信文を作成\n2. **承認依頼**：承認者にワークフロー申請を送信。承認者は「承認」or「却下」を選択\n3. **ステータス管理**：\n   - 未承認：承認者の確認待ち\n   - 承認済：投稿可能な状態\n   - 却下：修正が必要な状態\n4. **公開**：承認済みの投稿・クチコミ返信のみGBPに自動反映\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/51964474248985\n\n---\n\n## 写真の削除方法（個店）\n\n1. 左メニュー【Googleデータ連携】→【Googleビジネスプロフィール】→【写真管理】を選択\n2. 【オーナー提供】を選択\n3. 削除したい写真の右上【・・・】をクリックし【削除】を選択\n4. 確認ダイアログで【削除】をクリックして完了\n\n⚠️ **削除できるのは「オーナー提供」の写真のみ。「ユーザー提供」の写真はGoogleへの削除申請が必要。**\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/30654578060441\n\n---\n\n## グループでの写真の追加方法\n\n### ① 画面で登録（全店舗同じ写真を追加する場合）\n\n1. 左メニュー【Googleデータ連携】→【Googleビジネスプロフィール】→【写真管理】→【+新規登録】\n2. 「画面で登録」を選択\n3. カテゴリーを選択\n4. 対象店舗を選択（「対象店舗すべてチェック」で全店舗一括選択可）\n5. 画像をアップロード（複数枚可）\n6. プレビューを確認し【保存する】をクリック\n7. 投稿完了後、ベル通知（画面右上）でお知らせ\n\n### ② 写真一括登録（店舗ごとに写真が異なる場合）\n\n1. 【+新規登録】→「写真一括登録」を選択\n2. 以下のファイル名規則に従いファイルを準備してアップロード：\n\n**Googleに登録する場合：**\n```\nファイル名：Google_店舗ID_カテゴリー名_01.jpg\nカバー画像：Google_店舗ID_カバー.jpg\n```\n\nGoogleカテゴリー名：動画・食品と飲料・店内・商品・外観・メニュー・職場・共有エリア・チーム・客室\n\n**Yahoo!に登録する場合：**\n```\nファイル名：Yahoo_店舗ID_カテゴリー名_01.jpg\nカバー画像：Yahoo_店舗ID_カバー.jpg\n```\n\nYahoo!カテゴリー名：製品・サービス・内観・外観・その他\n\n⚠️ 同一カテゴリーに複数の写真を登録する場合は末尾を連番で設定（_01、_02…）。\n⚠️ カテゴリーの記載がない場合、Googleでは「オーナー提供」、Yahoo!では「その他」カテゴリーに登録される。\n⚠️ 店舗IDはグループ 店舗基本情報画面に記載されている。\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/4409631950745\n\n---\n\n## 写真・動画の推奨サイズ\n\n### 静止画（共通）\n\n| 項目 | 仕様 |\n|------|------|\n| 形式 | JPG または PNG |\n| ファイルサイズ | 10KB〜5MB |\n| 推奨解像度 | 縦720px × 横720px |\n| 最小解像度 | 縦250px × 横250px |\n| 最大解像度 | 縦10,000px × 横10,000px |\n\n### ロゴ画像\n\n| 最小解像度 | 縦200px × 横200px |\n| 最大解像度 | 縦20,000px × 横20,000px |\n\n### カバー画像\n\n| 最小解像度 | 縦216px × 横384px |\n| 最大解像度 | 縦1,430px × 横2,544px |\n\n### GBP動画\n\n| 時間 | 最大30秒 |\n| ファイルサイズ | 最大25MB（Dashboard経由も同様） |\n| 解像度 | 720p以上（1280×720px） |\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/30831493754649\n\n---\n\n## ロゴ写真・カバー写真\n\n### ロゴ写真\nお店や会社のロゴマーク・看板を掲載する。投稿時・クチコミ返信時にアイコンとして表示される。\n\n### カバー写真\nビジネスプロフィール上部に大きく表示される写真。外観など店舗の特徴が伝わる画像を設定する。\n\n⚠️ 設定した写真が必ず表示されるとは限らない。\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/4408208840601\n",
  "post-management.md": "# 投稿機能\n\n## 情報ソース\n\n| 資料名 | 種別 | 取得日 | 備考 |\n|--------|------|--------|------|\n| Instagram→GBP写真投稿 画面スクリーンショット | 画面キャプチャ | 2026-05-25 | Instagramアカウント連携一覧画面 |\n| MEO Dashboard Instagram→GBP写真管理 改修告知 | 追加機能告知 | 2026-05-25 | リリース日：2026-05-21（木）夜 |\n| MEO Dashboard 投稿 URL事前登録機能（PPTX） | 操作マニュアル | 2026-05-25 | リリース日：2026-05-14 |\n| MEO Dashboard ヘルプセンター（help-meodash.zendesk.com） | 公式ヘルプ | 2026-06-12 | Claude in Chromeで直接参照 |\n\n---\n\n## 投稿カテゴリの構成\n\n| セクション | 内容 |\n|-----------|------|\n| 個店 | 投稿の方法・AI翻訳機能・投稿複製（3記事） |\n| グループ | 一括投稿・Excel投稿 |\n| その他 | URL事前設定・投稿種類・予約投稿・画像規定・ステータス・繰り返し投稿・AI機能・エラー対処等（28記事） |\n\n---\n\n## 投稿の種類\n\nGBP投稿には以下の3種類がある。\n\n| 種類 | 用途 |\n|------|------|\n| **最新情報** | どんな情報にも使えるシンプルなフォーマット。タイトルは管理用のみで実際には表示されない |\n| **特典** | タイトル・クーポンコード・特典リンクなどを設定してプロモーションを発信 |\n| **イベント** | タイトル・開催期間などを設定して期間限定イベントを告知 |\n\n⚠️ グループ投稿では「COVID-19最新情報」も選択肢に表示される。\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/31060087837849\n\n---\n\n## 個店での投稿手順\n\n1. 左メニュー【Googleデータ連携】→【Googleビジネスプロフィール】→【投稿】\n2. 【新規投稿】をクリック\n3. 投稿の種類を選択（最新情報 / 特典 / イベント）\n4. 以下の項目を設定：\n   - **投稿日時**：即時投稿 or 予約投稿（予約は翌日以降の日時指定可）\n   - **投稿内容**：最新情報・イベントの内容を記述（AIアシスタントで作成も可）\n   - **画像**：イベントバナーや商品画像を設定（AIで画像作成も可）\n   - **ボタンの追加**：詳細情報へのアクセスや購入を促すボタン（URL設定）\n   - **ハッシュタグ**：主にSNS投稿連携時に使用\n   - **ワークフロー申請**：他者に確認してもらう場合に設定\n5. 画面右側の投稿イメージを確認し、【登録する】をクリックして完了\n\n**編集・削除：** 詳細下の編集マークを押下 → 修正 → 「登録」。削除は画面下部「投稿内容を削除」を選択。\n\n⚠️ **システムの関係上、1時間以内の連続投稿はお控えください。**\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/31057211107481\n\n---\n\n## グループからの一括投稿手順\n\n1. 【Googleビジネスプロフィール】→【投稿】→【新規投稿】\n2. 投稿する**媒体**を選択（Googleはデフォルトでチェック必須）\n3. 投稿フォーマットを選択し、以下の項目を設定：\n   - ①投稿日時（即時 / 予約）\n   - ②投稿内容（AIアシスタント利用可）\n   - ③画像（AI画像作成も可）\n   - ④ボタンの追加（詳細・購入へのURL）\n   - ⑤ハッシュタグ\n   - ⑥ワークフロー申請\n   - ⑦店舗選択（投稿したい店舗を選択）\n4. 【登録する】をクリック（即時は即反映、予約は指定日時に反映）\n\n⚠️ 【下書き保存】の場合は即時・予約・WF申請含め反映されない。\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/4417475994777\n\n---\n\n## 予約投稿の仕様\n\n- GBPの管理画面（business.google.com）では即時投稿のみ可能。**Dashboardでは最大5件まで予約投稿可能**\n- 当日予約は現在時刻より**3時間先**以降の時間を指定\n- 予約した投稿は**投稿時間の約1時間前まで**修正・削除可能\n- 期限なし設定可能（何年先でも予約設定可）\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/4408216263449\n\n---\n\n## 繰り返し投稿機能\n\n同じ内容を自動的に繰り返し投稿する設定。\n\n⚠️ **Googleのみ対応。ワークフロー申請は利用不可。**（Googleによる重複コンテンツ判定を避けるため、投稿済みの投稿を削除してから同内容を再投稿する仕様）\n\n### 繰り返しパターン\n\n| パターン | 設定内容 |\n|---------|---------|\n| 週 | 「1週間毎」または「2週間毎」＋曜日（月〜日）を指定 |\n| 月（日付） | 「1・2・3ヶ月」＋日付（1〜31・月末）を指定 |\n| 月（曜日） | 「1・2・3ヶ月」＋第N週＋曜日を指定 |\n\n- 終了日：任意設定可。未設定の場合は繰り返し継続\n- 投稿エラー時と繰り返し投稿開始時にお知らせ通知あり\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/56295491162521\n\n---\n\n## 投稿用画像の規定\n\n| 項目 | 仕様 |\n|------|------|\n| 形式 | JPG または PNG |\n| ファイルサイズ | 10 KB〜5 MB |\n| 推奨解像度 | 縦720px × 横720px |\n| 最小解像度 | 縦250px × 横250px |\n| 最大解像度 | 縦10,000px × 横10,000px |\n| 品質 | ピントが合っていて明るい写真。大幅な加工・過度のフィルタは避ける |\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/4408459089817\n\n---\n\n## 投稿後のステータス一覧\n\n| ステータス | 意味 |\n|-----------|------|\n| **投稿済** | 投稿が成功した状態 |\n| **Google処理中** | MEO DashboardからAPIで投稿成功したがGoogle側での表示確認待ち（Dashboardでは対応不可） |\n| **投稿待ち** | 予約済みで投稿バッチにまだ入っていない状態 |\n| **予約中** | 投稿バッチに入り投稿待ちの状態 |\n| **データ処理失敗** | 投稿バッチ処理時間が来ても予約投稿をバッチに入れられなかった |\n| **API投稿エラー** | APIでの投稿失敗（LOCAL_POST_STATE_UNSPECIFIEDによる不明原因エラーも含む） |\n| **投稿処理エラー** | 投稿途中でエラーが発生し投稿不可 → 内容確認後に再投稿 |\n| **投稿拒否** | Googleが投稿を拒否（電話番号・メールアドレス含有等） → 内容確認後に再投稿 |\n| **投稿削除** | GBP上で投稿が完全削除された状態（ユーザーまたはGoogle側による削除） |\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/11578133605913\n\n### 機能概要\n\nInstagramへのSNS投稿をGBPに自動連携する機能。Instagram→GBPの逆パターン連携のうち、写真に特化した設定。\n\n### Instagramアカウント連携画面の列構成\n\n| 列名 | 内容 |\n|------|------|\n| Facebookページ名 | 連携するFacebookページ |\n| メールアドレス | アカウントのメールアドレス |\n| アカウント名 | Instagramアカウント名 |\n| IG→GBP写真管理 | チェックONでInstagram写真をGBPに連携 |\n| **写真の投稿順序** | GBPに反映する写真を指定（2026-05-21追加） |\n| ハッシュタグなし投稿 | ハッシュタグを除外して投稿するか |\n| 電話番号投稿の除外 | 電話番号を含む投稿のブロック設定 |\n| 連携対象 | 連携対象かどうか |\n| 分析連携対象 | 分析連携の対象かどうか |\n| 連携ステータス | アクティブ等の状態 |\n\n---\n\n## IG→GBP写真管理：写真の投稿順序設定（2026-05-21リリース）\n\n### 概要\n\nInstagramの1投稿に複数枚の写真が含まれる場合に、GBPへ反映する写真を店舗単位で制御できる機能。\n\n### 入力条件\n\n- 「**IG→GBP写真管理**」チェックボックスがONの行のみ入力可能\n- 未入力の場合は**すべての写真がGBPに投稿**される（従来通りの挙動）\n\n### 入力ルール（2パターン）\n\n**【A】反映したい写真の番号をカンマ区切りで指定**\n\n投稿の何枚目の写真をGBPに反映するかを番号で指定する。\n\n| 入力例 | 意味 |\n|--------|------|\n| `1` | 1枚目のみ |\n| `2,3` | 2枚目と3枚目 |\n| `2,3,4` | 2・3・4枚目 |\n\n**【B】最後の写真を除外してGBPに反映**\n\n→ 「**最後の写真除外**」と入力する\n\n### ⚠️ 重要な制約\n\n- **【A】と【B】の併用は不可**（番号指定と「最後の写真除外」は同時に使えない）\n- 改修理由：MDC顧客要望\n\n---\n\n## 投稿機能 概要\n\nMEO DashboardからGBP・Yahoo!・Apple等への投稿を管理する機能。個店単位とグループ単位で利用可能。\n\n---\n\n## 投稿 URL事前設定機能（2026-05-14リリース）\n\n### 概要\n\n新規投稿作成時に「ボタンの追加」で設定するURLを事前登録しておくことができる機能。投稿のたびにURLを手入力する手間を省ける。\n\n### 設定場所\n\n**店舗詳細画面**に「投稿URL事前設定」欄を追加。\n- 投稿機能がONになっている店舗のみ表示される\n- URLは**最大10個**まで登録可能（カンマ区切りで登録）\n\n---\n\n### 個店 新規投稿画面での利用\n\n「ボタンの追加」欄で以下のいずれかを選択：\n\n| 選択肢 | 内容 |\n|--------|------|\n| URL 手動入力 | その都度URLを直接入力 |\n| 投稿URL事前設定を使用 | 事前登録済みのURLから選択 |\n\n- 事前設定が**未設定の場合**は「投稿URL事前設定を使用」は選択不可\n- 複数URLを事前登録している場合は**プルダウンで選択**\n\n---\n\n### グループ 新規投稿画面での利用\n\n「ボタンの追加」欄で以下のいずれかを選択：\n\n| 選択肢 | 内容 |\n|--------|------|\n| URL 手動入力 | その都度URLを直接入力 |\n| 投稿URL事前設定を使用 | 「登録URL選択」からURL選択 |\n\n「投稿URL事前設定を使用」を選択後、「登録URL選択」をクリックするとモーダルが表示され、以下の2方式から選択：\n\n**① 投稿URL事前設定を利用**\n- グループ内の各店舗に登録されているURLの一覧から選択\n- 任意のURL1つを選択し「選択する」で設定\n\n**② URL新規入力・登録を利用**\n- 投稿画面上で、そのグループ専用のURLを新たに登録できる\n- 「URL」と「URL登録名」を入力して「登録する」で登録\n- 登録済みURLのリストにチェックして「削除する」で削除可能\n- 登録したURLから任意の1つを選択して設定\n\n---\n\n### グループ 一括インポートでの利用\n\n- 「投稿URL事前設定リスト」のダウンロードが可能\n- ダウンロードしたリストのURLを参照して、一括インポートファイルの「ボタンURL」欄にURLを入力する\n\n---\n\n## ⚠️ 注意点\n\n- Instagram連携（単体）はInstagram→GBP投稿のみで、MEO Dashboardの投稿画面からInstagramへの投稿はできない\n- GBPに直接画像を投稿した場合、システムによる重複チェックが行われない。重複画像が登録される可能性があるため、同じ画像を投稿しないよう注意\n- 投稿URL事前設定は投稿機能がONの店舗のみ利用可能\n\n---\n\n## 詳細文AIアシスタント\n\nAIが投稿用テキストを生成する機能。投稿文章を作成する時間がない場合に活用できる。\n\n### 使用手順\n\n1. 【Googleデータ連携】→【Googleビジネスプロフィール】→【投稿】\n2. 新規投稿作成画面から【詳細文AIアシスタント】をクリック\n3. 文字数（400〜1200字の間で指定可）と生成指示内容（伝えたいポイント）を入力\n   - 例：「店舗リニューアルオープンのお知らせ」「閉店セールの訴求」等\n   - 生成指示内容を詳細に書くほどビジネスに沿った文章が生成される\n4. 生成完了後、候補が3つ表示される\n5. 最も近い候補の【◯】を選択→【登録する】をクリック\n6. 細かい修正・改行を行って完成\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/24667727895449\n\n---\n\n## 画像AIアシスタント\n\nAIが投稿用画像を生成する機能。投稿画像が手元にない場合に活用できる。\n\n### 使用手順（簡易設定）\n\n1. 新規投稿作成画面から【画像AIアシスタント】をクリック\n2. 作成したい画像イメージを文章で入力（生成指示内容）\n3. 場所（国内/海外・屋内/屋外）を任意で選択\n4. 【写真】または【イラスト】を選択\n5. 著作権を確認し【上記を確認しました】にチェック→【作成する】をクリック\n6. 候補が2つ表示される→【◯】で選択→【登録する】をクリック\n\n**詳細設定：** 簡易設定の内容に加えて「必須アイテム・服装・表情・登場人物・雰囲気」も設定可能（任意）。\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/30933450522521\n\n---\n\n## ハッシュタグAI生成機能\n\n投稿内容をもとにAIが関連ハッシュタグを自動生成し、投稿に付与できる機能。\n\n**対象：** 個別店舗・グループ\n\n### 使用手順\n\n1. 新規投稿画面で各項目を設定し投稿内容を入力\n2. 投稿内容が入力された状態で「ハッシュタグAI生成」ボタンをクリック\n3. ポップアップにハッシュタグ候補が表示される（最大10個を選択可）\n4. 「保存する」ボタンをクリックして投稿に付与\n\n⚠️ 文字数制限：Google 1500文字以内、Yahoo! 330文字以内（投稿内容+ボタンURL+ハッシュタグを合算）\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/45898921343513\n\n---\n\n## RSSブログ連携\n\n店舗のオウンドメディアやブログのRSSフィードを連携し、GBP・Yahoo!プレイスの投稿に自動反映する機能。\n\n### 設定手順\n\n1. 左メニュー【Googleデータ連携】→【Googleビジネスプロフィール】→【投稿】→【RSSブログ】を選択\n2. 以下の項目を設定：\n   - **RSSフィードURL**：オウンドメディア・ブログのRSS+xmlのURL\n   - **取得記事数**：最大5件\n   - **取得開始日**：この日以降の記事のみ対象\n   - **画像取得方法**：「OGPで画像を取得」または「最初の画像を使用」\n   - **投稿媒体**：Google・Yahoo! から選択\n3. 「保存する」をクリックして完了\n\n**動作仕様：** 毎日深夜1時に前日の投稿をバッチ処理で取得・反映。\n\n⚠️ OGPで画像を取得する設定でOGPが設定されていない記事は画像が取得されない。\n⚠️ RSSブログ連携ではボタンの追加はできない。\n⚠️ RSS取得をストップしたい場合はRSSフィードURLを空にして「保存する」をクリック。\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/47702403484569\n\n---\n\n## 商品投稿\n\n⚠️ **MEO DashboardからはGBP商品投稿は行えない。** Googleビジネスプロフィールの管理画面から直接投稿する必要がある。\n\n### GBPでの商品登録手順\n\n1. GBPを管理しているアカウントでログイン\n2. GBPを表示\n3. 「商品を編集」または「追加」ボタンを選択\n4. 詳細情報を入力（商品/サービスは必須・58文字以内）\n5. 登録後に「承認」ステータスになっているか確認（ポリシー違反の場合は不承認になりマップに表示されない）\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/4408893659417\n",
  "rank-tracking.md": "# 順位計測機能\n\n## 情報ソース\n\n| 資料名 | 種別 | 取得日 | 備考 |\n|--------|------|--------|------|\n| MEO Dashboard 順位取得 微調整 リリース共有 | リリース共有 | 2026-05-25 | リリース日：2026-05-07 |\n| 検索結果 画面スクリーンショット | 画面キャプチャ | 2026-05-25 | A・B・C接頭辞付きのGoogle検索結果例 |\n| MEO Dashboard ヘルプセンター（help-meodash.zendesk.com） | 公式ヘルプ | 2026-06-12 | Claude in Chromeで直接参照 |\n\n---\n\n## 機能概要\n\nMEO Dashboardが自動でGoogle検索結果を取得し、対象店舗の順位を計測する機能。（詳細は基本マニュアル収録後に追記予定）\n\n---\n\n## 順位取得ロジック 微調整（2026-05-07リリース）\n\n### 問題の背景\n\nGoogleの検索結果（特にローカルパック）では、結果の各店舗に「A」「B」「C」などのアルファベット接頭辞が付与されるケースがある。\n\nこの接頭辞が付いた状態でビジネス名を文字列判定しようとすると、正しく店舗名を識別できず、順位取得が失敗するケースが発生していた。\n\n### 対応内容\n\n接頭辞（A・B・C等）が付与されている場合でも、ビジネス名を正しく判定できるよう順位取得ロジックを調整。\n\n### 対象ケース（スクリーンショット例）\n\nGoogle検索結果のローカルパック表示において、地図上のピンと店舗一覧にA・B・Cのラベルが付与されるパターン。\n\n```\nA ○○○○（店舗名）\n  営業中・営業終了：19:00\n\nB ○○○○（店舗名）\n  営業中・営業終了：19:00\n\nC ○○○○（店舗名）\n  営業中・営業終了：19:00\n```\n\nこのような表示形式でも順位を正しく取得できるようになった。\n\n### ⚠️ 注意点\n\n- この調整以前（2026-05-07以前）に取得された順位データで、接頭辞起因の誤判定が発生していた場合、過去データの補正は行われない\n- 顧客から「順位が急に変わった」「以前と数値が違う」という問い合わせが来た場合、このリリース前後の期間かどうかを確認するとよい\n\n---\n\n## 順位チャートの基本仕様（公式ヘルプより）\n\n### 情報ソース追加\n\n| 資料名 | 種別 | 取得日 | 備考 |\n|--------|------|--------|------|\n| MEO Dashboard ヘルプセンター（help-meodash.zendesk.com） | 公式ヘルプ | 2026-06-04 | Claude in Chromeで直接参照 |\n\n### 順位取得タイミング\n\n1日2回、順位を取得し、**良い方の順位をDashboardに表示**する。\n\n| 取得回 | 時間 | 取得元 |\n|--------|------|--------|\n| 1回目 | 10時ごろ | Google検索（ブラウザ）での順位 |\n| 2回目 | 20時ごろ | Google Mapでの順位 |\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/19078033715609\n\n### 順位表示の特殊ステータス\n\n| 表示 | 意味 |\n|------|------|\n| **ローカル検索表示なし** | 検索結果にマップ表示がされていない状態 |\n| **競合ナレッジパネル** | 検索結果に競合他社1社のみのナレッジパネルが表示されている状態（マップなし・1社のみ） |\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/4408831019417\n\n### 順位カテゴリの機能構成\n\n| セクション | 機能 |\n|-----------|------|\n| 順位チャートについて | キーワード分析・順位チャートの確認・取得タイミング・競合キーワード別デイリーランキング（12記事） |\n| カレンダー順位レポートについて | カレンダー形式での順位確認・掲載順位の仕様 |\n| 多地点順位チェックについて | 複数地点での順位計測（設定・結果確認・計測間隔）（9記事） |\n\n---\n\n## 順位チャートの確認方法（基本操作）\n\n個店画面の【順位レポート】→【順位チャート】から確認。\n\n### 画面内の各セクション\n\n| セクション | 内容 |\n|-----------|------|\n| **キーワード別前日比ランキング** | 設定キーワードの前日順位と前日比を表示 |\n| **キーワード別デイリーランキング** | 任意期間のキーワード順位推移。デフォルト「20位以内のみ」表示。「すべて」「10位以内のみ」「3位以内のみ」に切替可能 |\n| **全キーワード平均値デイリーランキング** | 設定キーワードの順位平均値の推移 |\n| **競合キーワード別デイリーランキング** | 同エリア・キーワードで検索した競合店舗の順位 |\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/31943143555737\n\n---\n\n## キーワード分析（店舗ページ限定機能）\n\n⚠️ **店舗ページ限定の機能。**\n\n**アクセス方法：** 左メニュー【順位レポート】→【キーワード分析】\n\n### 表示される指標\n\n| 指標 | 内容 |\n|------|------|\n| 最高順位 | 当月で最も順位の高いキーワードと検索エリア |\n| 最低順位 | 当月で最も順位の低いキーワードと検索エリア |\n| 3位以内率 | 3位以内に入った回数 ÷（キーワード数 × 日数）|\n| GBPの検索総数 | 直近1ヶ月のキーワード検索数の合計値 |\n| 3位以内率のキーワード別推移（Google） | 直近5ヶ月のキーワードごとの3位以内率推移 |\n| 直近3ヶ月ランキング4位〜10位のキーワード | 直近3ヶ月の最高順位が4〜10位のキーワード一覧 |\n| GBP表示の検索語句数（直近5ヶ月） | 直近5ヶ月においてビジネスプロフィール閲覧につながった検索語句数 |\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/32867624521369\n\n---\n\n## カレンダー順位レポート（店舗ページ限定機能）\n\n⚠️ **店舗ページ限定の機能。**\n\nGBPにユーザーが流入した際に使用した検索キーワードの1ヶ月間レポートをカレンダー形式で確認できる。\n\n**アクセス方法：** 左メニュー【順位レポート】→【カレンダー順位レポート】\n\n**設定できる項目：** 対象年月・検索キーワード・対象媒体\n\n**「拡大表示」：** 1ヶ月分の順位を一覧で確認可能\n\n**日次順位レポート：** 日ごとのキーワード順位をGoogleマップのキャプチャで確認できる\n\n**カレンダー順位レポートに掲載している順位について：**\nGoogleマップでの掲載順位を表示している。\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/32868419793433\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/4408207723033\n",
  "report-delivery.md": "# レポート配信機能\n\n## 情報ソース\n\n| 資料名 | 種別 | 取得日 | 備考 |\n|--------|------|--------|------|\n| レポート配信予約_任意指定.png（画面キャプチャ） | 画面キャプチャ | 2026-05-25 | レポート配信予約画面の全体構成 |\n| グループ版プレミアムレポート「任意指定」新フォーマット対応 リリース共有 | リリース共有 | 2026-05-25 | リリース日：2026-05-19 |\n\n---\n\n## レポート配信予約画面の概要\n\n各店舗・グループのレポートを指定日時にメール配信する予約設定画面。\n\n### 前提・制約事項（画面上部に表示）\n\n- **契約終了店舗**：レポート配信不可。店舗名選択もできない\n- **GBPアカウント未連携店舗**：Googleキーワード／Yahoo!キーワード／SEOキーワードに関する順位レポートのみダウンロード可能。対象期間に順位データが存在しない場合は表紙のみのレポートが出力される\n\n---\n\n## 設定項目一覧\n\n| 項目 | 内容 |\n|------|------|\n| 会社名・ID | 対象会社を選択 |\n| 店舗名・ID | 対象店舗を選択 |\n| グループ名 | 対象グループを選択 |\n| 抽出キーワード | 「すべて」または絞り込み指定 |\n| レポート名 | 最大50文字 |\n| 配信レポート | 通常レポート／プレミアムレポート から選択 |\n| レポート配信日時 | 「繰り返し指定」または「任意指定」のいずれかを設定 |\n| レポートの形式 | PPT形式／PDF形式 から選択 |\n| 資料添付 | ファイル添付が可能 |\n| レポートの送付先メールアドレス | 複数の場合は「,」区切りで入力 |\n| メール件名 | 任意で設定 |\n| メール本文 | メッセージAなどのテンプレートから選択・編集 |\n\n---\n\n## レポート配信日時の設定方式\n\n### 繰り返し指定（赤枠）\n\n定期的な自動配信を設定する方式。\n\n- 頻度例：月次\n- タイミング例：毎月5日以降\n- **4/9リリース**：グループプレミアムレポートの新フォーマットが先行適用済み\n\n### 任意指定（緑枠）\n\n特定の日時を指定して1回配信する方式。\n\n- 配信日時：カレンダーで日付と時刻を指定\n- **5/19リリース**：グループプレミアムレポートの新フォーマットが任意指定にも適用された（後述）\n\n---\n\n## グループ版プレミアムレポート 新フォーマット対応の経緯\n\n| リリース日 | 対象 | 内容 |\n|-----------|------|------|\n| 2026-04-09 | 繰り返し指定 | 新フォーマット先行リリース |\n| 2026-05-19 | **任意指定** | 新フォーマットを任意指定にも適用 |\n\n---\n\n## 2026-05-19リリース 変更内容詳細\n\n### 対象\n\nレポート配信予約の「グループ版プレミアムレポート（任意指定）」\n\n### 変更点①：新フォーマットの適用\n\n任意指定でファイル出力した場合も、新フォーマットでレポートが作成されるようになった。\n\n### 変更点②：レポートの種類の選択肢変更\n\n| 変更前 | 変更後 |\n|--------|--------|\n| 1ヶ月レポート／3ヶ月レポート／半年レポート | **1ヶ月レポートのみ** |\n\n3ヶ月・半年レポートは1ヶ月レポートと内容が同一だったため、選択肢から除外。\n\n---\n\n## ⚠️ 注意点\n\n**「レポート出力画面」から直接出力するレポートは今回の改修対象外。**\n新フォーマットが適用されるのは「レポート配信予約」経由の出力のみ。直接出力については別途確認が必要。\n\n---\n\n## レポート配信予約の基本手順\n\n1. レポート配信一覧を開き、「レポート配信予約」ボタンを押下\n2. グループを指定し、プレミアムレポートの設定を行う\n3. 配信日時・形式・送付先メールアドレス等を設定\n4. 「設定」ボタンで保存\n",
  "review-analytics.md": "# クチコミ分析機能\n\n## 情報ソース\n\n| 資料名 | 種別 | 取得日 | 備考 |\n|--------|------|--------|------|\n| MEO Dashboard クチコミ分析 表とダウンロードファイル調整 PPTX | 仕様変更資料 | 2026-05-25 | 資料作成日：2026-05-07 リリース日：2026-05-08 |\n| MEO Dashboard クチコミ分析 リリース共有 | リリース共有 | 2026-05-25 | リリース日：2026-05-08 |\n| MEO Dashboard ヘルプセンター（help-meodash.zendesk.com） | 公式ヘルプ | 2026-06-12 | Claude in Chromeで直接参照 |\n\n---\n\n## 機能概要\n\nクチコミの集計・分析データを確認できる機能。（基本マニュアルは未収録。詳細は追加資料収録後に更新予定）\n\n---\n\n## 対象グラフ・データ\n\nクチコミ分析では主に以下の2つのグラフ・表・ダウンロードデータを管理：\n\n- **【累計】クチコミ平均点と件数**\n- **【最新】平均点と件数の推移**\n\n---\n\n## 表示期間と表・ダウンロードファイルの連動（2026-05-08リリース）\n\n### 改修内容\n\n従来は表示期間を変更した際、「【累計】クチコミ平均点と件数」グラフのみ連動して表示されていた。今回の調整で**表・ダウンロードファイルにも表示期間が連動**するようになった。また、ダウンロードファイルにグラフが追加された。\n\n対象：【累計】クチコミ平均点と件数・【最新】平均点と件数の推移（両グラフとも同様）\n\n### 表示期間別の集計粒度\n\n| 表示期間 | 表・グラフの集計粒度 |\n|---------|------------------|\n| 1週間 | **日毎**の数値を表示 |\n| 1ヶ月 | **日毎**の数値を表示 |\n| 3ヶ月 | **月毎**の数値を表示 |\n| 6ヶ月 | **月毎**の数値を表示 |\n| 12ヶ月 | **変更なし**（従来と同一） |\n| カスタム（31日間以下） | **日毎**の数値を表示 |\n| カスタム（32日間以上） | **月毎**の数値を表示 |\n\n### 改修理由\n\n社内要望。\n\n---\n\n## ⚠️ 注意点\n\n- 12ヶ月指定の場合のみ変更なし\n- カスタム期間は31日以下か32日以上かで集計粒度（日毎/月毎）が切り替わる境界がある\n- ダウンロードファイルにグラフが追加されたため、ファイル構成が変わっている点に注意\n\n---\n\n## クチコミ分析カテゴリの構成\n\n| セクション | 内容 |\n|-----------|------|\n| クチコミ分析 | 個店・グループの分析画面、ダウンロードデータの差異 |\n| クチコミ傾向分析 | キーワード登録・感情分析・競合比較（10記事） |\n| クチコミハイライト分析 | GBPのハイライトワード抽出・表示（5記事） |\n\n---\n\n## クチコミ分析画面（個店）\n\nGBPについたクチコミの数と評価の推移を確認できる画面。2つのグラフとそれに対応した表が表示される。\n\n### グラフ1：【累計】クチコミ平均点と件数（月別）\n\n- 折れ線グラフ：その月までのクチコミ平均点の累計推移\n- 棒グラフ：その月までのクチコミ件数の累計\n- グラフ下部に表形式で数値確認可能\n- グラフにカーソルを合わせると詳しい数値を確認できる\n\n⚠️ クチコミはユーザーが削除できるため、件数が下がる場合がある。\n\n### グラフ2：【最新】平均点と件数の月別推移\n\n- その月に届いたクチコミの平均点と件数を棒グラフで表示\n- グラフ下部に表形式で数値確認可能\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/53235828394009\n\n---\n\n## クチコミ分析画面（グループ）\n\nグループ単位での集計表示。\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/53237069909657\n\n---\n\n## クチコミ傾向分析\n\n### 機能概要\n\n店舗に寄せられたクチコミに含まれるキーワード・評価点・感情などを分析できる機能。キーワードごとに傾向を可視化し、改善施策のヒントを提供する。\n\n**主な機能：**\n- キーワード自由登録（1店舗最大10件、1グループ最大10件）\n- 感情分析（ポジティブ・ネガティブ）・★評価点・話題数での傾向分析\n- 過去データとの期間比較\n- キーワードのグルーピング機能\n- 他店舗（競合）とのキーワード比較（※個店のみ）\n\n### 表示される指標\n\n| 指標 | 内容 |\n|------|------|\n| A：キーワード | クチコミに含まれているキーワード |\n| B：感情分析値 | キーワードが入ったクチコミの感情分析値（AWSの感情分析より計算） |\n| C：話題数 | キーワードが含まれるクチコミが話題にあがった数 |\n| D：評価平均点 | キーワードが含まれるクチコミの評価平均点 |\n| E：検出ワード | キーワードに係る形容詞。その検出ワードを含むクチコミの比率を表示 |\n\n### キーワード出現一覧\n\n- キーワード数が多い順・出現率・関連ワード・ポジティブ判定等を確認可能\n- キーワードを押下すると該当クチコミを表示\n\n**表示対象：** 最新50件のクチコミのうち、「キーワード」＋「関連ワード（形容詞）」上位3つのいずれか1つ以上を含むクチコミ\n\n### 仮登録と本登録の違い\n\n| 区分 | 説明 |\n|------|------|\n| 仮登録 | 分析用の一時登録。一定期間後に削除される |\n| 本登録 | 継続的な分析のための正式登録。翌朝のバッチ処理後にデータが反映される |\n\n⚠️ 本登録後にデータが表示されない場合は翌朝のバッチ処理（データ更新）を待つ。\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/47885192284569\n\n---\n\n## クチコミハイライト分析\n\n### 機能概要\n\nGBPのレビュー欄上部に記載されているハイライトワード（レビューで多く含まれているワード）を抽出して画面表示する機能。\n\n- GBP画面で表示されている件数をそのまま取得\n- **データ取得：1ヶ月に1回（毎月1日）**\n- ハイライトワードを押下すると関連クチコミが表示される\n- 再度押下するとクチコミ表示を閉じる\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/51220654311833\n",
  "review-management.md": "# クチコミ管理\n\n## 情報ソース\n\n| 資料名 | 種別 | 取得日 | 備考 |\n|--------|------|--------|------|\n| グループクチコミ管理 画面スクリーンショット | 画面キャプチャ | 2026-05-25 | グループ クチコミ管理一覧画面 |\n| MEO Dashboard グループクチコミ管理機能 改修リリース告知 | 追加機能・仕様変更資料 | 2026-05-25 | リリース予定：2026-05-26夜 |\n| MEO Dashboard ヘルプセンター（help-meodash.zendesk.com） | 公式ヘルプ | 2026-06-12 | Claude in Chromeで直接参照 |\n\n---\n\n## クチコミ返信カテゴリの構成\n\n| セクション | 内容 |\n|-----------|------|\n| 個店 | 一括返信・自動返信設定・返信テンプレート・AI返信アシスタント（7記事） |\n| グループ | 一括返信・自動返信設定・返信テンプレート・AI返信アシスタント（7記事） |\n| その他 | 反映タイミング・投稿通知・削除申請・ソート・自動返信実行されない場合等（12記事） |\n\n---\n\n## クチコミ管理画面の概要\n\nMEO Dashboard上でGoogleクチコミの確認・返信・分析ができる機能。個店単位とグループ単位の両方で利用可能。\n\n### NEWマーク・感情分析\n\n- 新着クチコミが入った場合：メニュー右横に「NEW」マークが表示される\n- ネガティブなクチコミが入った場合：メニュー右横に「！」マークが表示される\n\n---\n\n## グループ クチコミ管理画面\n\n### クチコミ一覧の表示項目\n\n| 列名 | 内容 |\n|------|------|\n| 投稿者名 | クチコミ投稿者のアカウント名・アイコン |\n| 評価 | 星評価（5段階） |\n| コメント | クチコミ本文（クリックで全文表示） |\n| 初回投稿日 | クチコミが最初に投稿された日時 |\n| 最新更新日 | クチコミが最後に更新された日時 |\n| 最新返信日 | 最後に返信した日時 |\n| 店舗名 | 対象店舗名 |\n| 返信 | 返信済み（「済」）または未返信の状態 |\n| 感情分析 | AIによる感情分析スコア（例：ポジティブ 96%、普通 4%） |\n| WF承認 | ワークフロー承認状況（「WFなし」「承認済」「却下」等） |\n\n### 絞り込み・検索・ダウンロード\n\n- 日付軸（初回投稿日 / 最新更新日）・店舗・評価で絞り込み\n- 「ダウンロード」ボタンで絞り込みしたクチコミをExcelエクスポート\n\n---\n\n## 個店での一括返信（Excel経由）\n\n1. 左メニュー【Googleデータ連携】→【Googleビジネスプロフィール】→【クチコミ管理】\n2. 【ダウンロード】でクチコミをExcelにダウンロード\n3. Excelで確認：\n   - B〜D列：投稿者名・★数・コメント\n   - K列：返信ステータス（返信済：「済」、未返信：「未」）\n4. 返信ステータスが「未」のクチコミに対して【L列】に返信内容を入力\n5. Excelを保存\n6. Dashboard に戻り【一括インポート】から作成したExcelを選択してインポート\n\n⚠️ インポート完了後、即時でクチコミが返信される。Google側の処理状況によっては数分かかる場合あり。\n⚠️ ワークフロー機能を使用する場合は【ワークフローを使用】から承認者を選択してからインポート。\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/31272423656217\n\n---\n\n## グループでの一括返信（Excel経由）\n\n1. グループ管理画面のメニュー【クチコミ一括返信・自動返信】をクリック\n2. 【クチコミ一括返信】でフォルダ・期間・媒体（Google/Yahoo!）を設定し【ダウンロード】\n3. Excelで確認：\n   - B列：店舗名\n   - I〜K列：投稿者名・★数・コメント\n   - R列：媒体\n   - S列：返信ステータス（「済」/「未」）\n4. ステータスが「未」のクチコミの返信内容を【T列】に入力\n5. Excelを保存\n6. Dashboard に戻り【一括返信インポート】から作成したExcelを選択してインポート\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/28754870396185\n\n---\n\n## 自動返信機能\n\n### 個店の自動返信設定\n\n★の数やコメントの有無など事前設定した条件に合致するクチコミが投稿された際に、自動で返信する機能。\n\n**設定手順：**\n1. 【Googleビジネスプロフィール】→【クチコミ管理】を開き「返信パターン・自動返信」をクリック\n2. 各項目を選択・入力して返信パターンを登録\n3. 「自動返信」に☑を入れる\n\n**自動返信実行タイミング：** 毎日10時〜22時の間、**2時間おき**に処理\n\n⚠️ 返信パターンの登録のみ行う場合は「自動返信」の☑を外すと登録のみで返信は行わない。\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/18103444215193\n\n---\n\n### グループの自動返信設定（Excel経由）\n\n**設定手順：**\n1. 【Googleデータ連携】→【Googleビジネスプロフィール】→【クチコミ一括返信・自動返信】にアクセス\n2. 「クチコミ自動返信」の【ダウンロード】でテンプレートをダウンロード\n3. テンプレートに条件を設定：\n   - 投稿パターン名（管理用名称）\n   - 感情分析評価（ポジティブ/ネガティブ等）※AWSの感情分析を使用\n   - 評価点（星1〜5）\n   - コメントの有無\n   - 返信内容\n   - 自動返信：「○」で自動返信ON\n4. 【自動返信一括インポート】でファイルをインポート\n\n⚠️ **現時点でグループ画面からの自動返信設定の削除機能はない。** 使用しない設定は「自動返信」欄を「✕」にして自動返信をOFFにする。\n⚠️ 必ず最新のテンプレートをダウンロードして設定すること。\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/53392107231513\n\n---\n\n## クチコミAI返信アシスタント（グループ）\n\nAIがクチコミのコメントや星の数を考慮して、自動で返信コメントを作成する機能。\n\n**手順：**\n1. グループ管理画面【クチコミ一括返信・自動返信】をクリック\n2. 【クチコミAI返信アシスタント】でフォルダ・期間・媒体を設定\n3. 「AI返信アシスタント条件設定」で各項目を選択：\n\n| 設定項目 | 選択肢 |\n|---------|--------|\n| 文字数 | 150〜400文字 |\n| 評価の星 | コメントと併せて星の数を考慮するか否か |\n| 投稿者名 | 「不要」「○○様」「○○さん」の3択 |\n| 返信者役職 | 「指定なし」「リーダー」「マネージャー」「店長」「オーナー」「社長」「部長」の7択 |\n| 冒頭店舗名お礼文 | ☑で「この度は、〇〇へご来店いただきありがとうございます。」を冒頭に追加 |\n| 末尾店舗署名 | 返信文末尾にビジネス名を記載するか |\n| 当店表記にする | AI生成文の「弊社・当社」を「当店」に変更 |\n| 投稿言語でAI生成 | 例：英語クチコミ→英語で返信 |\n\n4. 「登録する」→【AI返信文章ダウンロード】でExcelをダウンロード\n5. T列【返信内容】のAI生成コメントを確認・修正\n6. Excelを保存\n7. Dashboard に戻り【一括返信インポート】からExcelをインポート\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/28756033534105\n\n---\n\n## Dashboardへのクチコミ反映タイミング\n\n### 新規連携時\n\n連携した日の**23時30分**にすべてのクチコミデータを取得し、翌日Dashboardに反映。\n\n### 連携後の定期取得\n\n| タイミング | 内容 |\n|-----------|------|\n| **月1回**（10〜25日のランダム） | 1店舗1回、すべてのクチコミを全件取得 |\n| **毎日6回**（5・8・11・14・17・20時） | 3時間おきにバッチ処理でクチコミ取得と自動返信処理 |\n| **毎日23時30分** | DashboardとGBPのクチコミ件数を比較し、不足があれば全件取得（自動返信は行わない） |\n\n**5時バッチの特記仕様：** 前日20時〜当日5時までのクチコミデータ取得と自動返信処理を行う。\n\n⚠️ バッチ処理の時間は目安であり、反映までにラグが生じる可能性がある。\n\n### 「全クチコミ取得」ボタン\n\nクチコミ一覧画面の右上にある「全クチコミ取得」ボタンを押すと手動で全件取得できる（クリック回数制限なし）。GBP上でクチコミ返信を行い当ツール上にデータがない場合などに利用。\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/21007623734809\n\n---\n\n## 「全クチコミ取得」ボタン（グループ）（2026-05-26リリース）\n\nグループ クチコミ管理一覧画面の右上に「全クチコミ取得」ボタンを追加。\n\n**動作仕様：**\n1. ボタン押下後、クチコミ取得処理を開始\n2. 押下直後にメッセージを表示：「全クチコミを取得しています。完了後、ベル通知にてお知らせしますので、ご確認ください。」\n3. 取得処理中も他画面の操作が可能（バックグラウンド処理）\n4. 取得完了後、ベル通知を送信\n5. 一部店舗でエラーが発生した場合は通知内のファイルに対象店舗名を記載\n\n---\n\n## クチコミ投稿通知機能\n\n⚠️ **デフォルトはOFF。ONにする場合は担当まで連絡。**\n\n新規クチコミが投稿された際に担当者へ通知メールを送信する機能。\n\n**通知タイミング：** 1日3回のバッチ処理（8・14・20時）で新着クチコミを取得し、該当する場合に通知メールを送信。\n\n### ネガティブアラート\n\nネガティブなクチコミが入った際にアラート通知を送信。クチコミ管理メニューに「！」マークが表示される。\n\n| バッチ回 | 処理時間帯 | 「！」表示期間 |\n|---------|-----------|-------------|\n| 1回目 | 8時〜17時頃 | 8時〜17時 |\n| 2回目 | 14時〜23時頃 | 14時〜23時 |\n| 3回目 | 20時〜翌朝5時頃 | 20時〜翌日朝5時 |\n\n⚠️ 3回のバッチが連続処理されるため、「！」マークがずっと表示され続けているように見える場合がある。\n\n### キーワード設定（クチコミ投稿通知）\n\n店舗詳細設定でキーワードを設定すると、そのキーワードを含むクチコミが投稿された場合にも通知メールを送信。\n\n- 設定場所：店舗詳細ページ下部「キーワード設定（クチコミ投稿通知）」\n- 最大**100個**まで登録可能\n- ⚠️ 会社詳細設定では「キーワード設定（クチコミ投稿通知）」は表示されない\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/48277405645081\n\n---\n\n## クチコミ削除申請\n\nGBPのクチコミをGoogleに削除申請する手順。\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/54469350007065\n",
  "review-promotion.md": "# クチコミ促進・アンケート機能\n\n## 情報ソース\n\n| 資料名 | 種別 | 取得日 | 備考 |\n|--------|------|--------|------|\n| MEO Dashboard ヘルプセンター（help-meodash.zendesk.com） | 公式ヘルプ | 2026-06-12 | Claude in Chromeで直接参照 |\n\n---\n\n## 機能概要\n\n⚠️ **MEO Dashboardの有料オプション機能。**\n\nURLやQRコードを介したアンケート画面で情報を集め、最終的にGoogleのクチコミ記入画面へ自動遷移する機能。クチコミを集めるツールとして活用できる。\n\n---\n\n## クチコミ促進カテゴリの構成\n\n| セクション | 内容 |\n|-----------|------|\n| 個別店舗のアンケート作成方法 | 個店向けアンケート作成（概要・編集・作成手順） |\n| グループのアンケート作成方法 | グループ向け（AI生成レビュー・全店舗共通URL・個別URL・リダイレクト） |\n| アンケート作成方法（その他） | 回答者付き・多言語設定・デザイン変更・QRコード設定 |\n| アンケート結果 | 結果の見方（個別店舗・グループ） |\n| アンケート配布について | 配布方法（個別店舗・グループ） |\n| クチコミ依頼について | NG行為・注意点・集めやすくする方法（15記事） |\n| クチコミ依頼一覧について | 予約時間変更・個人情報・編集可能期間・QRコード等 |\n\n---\n\n## アンケートの種類\n\n### ①オリジナルアンケート\n\n一般的なアンケート形式で作成できる。設問数：1〜10問。\n\n作成後、回答者はアンケートに答えてからGoogleのクチコミ記入画面へ遷移する。\n\n### ②AI生成レビューアンケート\n\n回答者が答えた内容をもとに、クチコミに記入するような文章をAIが生成する機能付きアンケート。回答者がGoogleのクチコミ画面にペーストして使用する。\n\n設問数：3〜10問。\n\n**仕組み：** アンケート回答後、AIが自動でレビューを生成 → 回答者が【レビューをコピーして次へ】を押すとテキストが自動コピーされる → クチコミ記載画面で貼り付けるだけで入力完了（文章の追加・修正も可能）\n\n⚠️ **店舗を追加した場合、自動的にグループアンケートの対象に追加される仕様**\n\n### AI生成レビューアンケートの作成手順\n\n1. 左メニュー【プロモーションメニュー】→【クチコミ促進】→【アンケート一覧】\n2. 右上【新規作成】→【AIレビュー生成アンケート】を選択\n3. **言語の選択**：「アンケート(原文)」「English（英語）」「French（フランス語）」から選択\n4. **アンケートタイプを設定**：\n   - **アンケートURL発行方法**：\n     - グループ共通URL発行：グループ全体で1つのURL・QRコード。お客様が店舗を選択\n     - 店舗ごとのURL発行：各店舗ごとにURL・QRコードを発行。お客様の店舗選択が不要\n   - **店舗選択方法**（グループ共通URL発行の場合のみ設定可）：\n     - 店舗名プルダウン選択：都道府県・キーワード検索から選択\n     - 店舗一覧選択（店舗名ボタン選択）：都道府県から店舗名を選択\n   - **アンケート対象店舗**：グループ全選択 または 対象店舗を個別選択\n5. **アンケート名**を設定（アンケート上部に表示される）\n6. **質問を作成**：\n   - 最低3問・最高10問まで設定可能（15問まで作成可能）\n   - 回答形式：選択形式・2択形式・自由入力形式（自由入力のみ必須/任意を選択可能）\n   - 1問目は「Googleレビュー画面へ遷移」「ツールのレビューへ遷移」を選択可能 → **1問目はサービスの満足度・店舗の総合評価などを推奨**\n   - ⚠️ 質問数が3問で2択質問を設定する場合は1問のみ設定可能\n7. **任意設定**：\n   - **Google投稿フォームへクリックのみレビュー遷移**：チェックなし（3秒後自動遷移）/ チェックあり（「Google投稿フォームへ」ボタンをクリックで遷移）\n   - **アンケート回答者付き**：チェックを入れると回答後に氏名・メールアドレス等の入力ボックスが追加される（回答者情報はExcelダウンロードまたは担当者メールに送信）\n8. 【登録する】を押して完了\n9. 作成したアンケートのURL・QRコードは【アンケート一覧】の【プレビュー・二次元バーコード】（🔍️）から取得\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/42034903204249\n\n---\n\n## アンケートURLの種類（グループ）\n\n| URL種別 | 内容 |\n|---------|------|\n| 全店舗共通URL | 全店舗で同一のアンケートURLを使用 |\n| 個別店舗ごとに異なるURL | 店舗ごとに異なるURLを発行 |\n| リダイレクト処理URL | グループのみ対応。特定条件でリダイレクト |\n\n---\n\n## クチコミ依頼のNG行為・注意点\n\nGoogleポリシー上、クチコミ依頼にはNG行為が存在する。\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/56976504286617\n\nクチコミ収集時の注意点についても確認が必要。\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/54803249135129\n\n---\n\n## ⚠️ 運用上の注意点\n\n- アンケートの編集可能期間に制限がある（配布後の変更に注意）\n- クチコミ促進機能を使ってSMSまたはメールで送られたお客様情報の取り扱いに注意\n- クーポン取得時の位置情報を「必須」「任意」で設定可能\n",
  "sns-integration.md": "# SNS連携機能（Dashboard→SNS投稿）\n\n## 情報ソース\n\n| 資料名 | 種別 | 取得日 | 備考 |\n|--------|------|--------|------|\n| MEO Dashboard ヘルプセンター（help-meodash.zendesk.com） | 公式ヘルプ | 2026-06-12 | Claude in Chromeで直接参照 |\n\n---\n\n## SNS連携カテゴリの構成\n\n| セクション | 内容 |\n|-----------|------|\n| SNS連携前にご確認ください | 運用フロー・投稿注意点・特定キーワード |\n| Facebook・Instagram連携 | 各アカウント連携手順（10記事） |\n| X（旧Twitter）連携 | アカウント連携・Developer Portal操作 |\n| 投稿方法 | Dashboard→SNS+GBP同時投稿・削除反映（7記事） |\n| Instagram分析機能 | ダッシュボード・競合分析・ファンユーザーリスト（12記事） |\n| LINE連携 | LINE公式アカウント連携・メッセージ配信（9記事） |\n\n⚠️ **SNS逆パターン（SNS→GBP）は `references/sns-reverse-integration.md` を参照。**\n\n---\n\n## Instagram連携（単体：Facebookを経由しない方法）\n\n**前提：** Instagramアカウントのみで連携可能。ただし連携できるアカウントは**1つのみ**。\n\n1. ビルアイコン→【設定】→【店舗】→連携を行う店舗をクリック\n2. ページ下部の【Instagram連携】→【Instagramアカウント連携（単体）】をクリック\n3. 【警告】が表示されるが新規連携の場合は【確認】を押す（現在連携済みのアカウントがある場合は既存連携が切れるので注意）\n4. Instagramにログイン（セキュリティコードが届く場合あり）\n5. 【許可する】を選択\n6. DashboardのInstagram連携画面で連携アカウントが表示・「アクティブ」になっているか確認\n7. 【連携対象】にチェックを入れて連携完了\n\n⚠️ **【連携対象】にチェックを入れていない場合、投稿の取得はされない。**\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/31514282544921\n\n---\n\n## Instagram連携（Facebook経由）\n\n**前提：** InstagramプロアカウントとFacebookビジネスページのリンクが必要。\n\n1. 管理画面右上アイコン→【設定】→【店舗】→連携したい店舗を選択\n2. ページ下部の【Instagram連携】→「＋Instagramアカウント追加」をクリック\n3. 1店舗目：連携したいInstagramとリンクしているFacebookでログイン\n   - 「現在および今後のページすべてにオプトイン」を選択→「続行」\n   - 「現在および今後のInstagramアカウントすべてにオプトイン」を選択→「続行」\n   - 「保存」をクリック\n4. 2店舗目以降：「Reconnect」をクリック\n5. 「OK」をクリック\n6. ページ下部の【Instagram連携】で連携店舗のFacebookビジネスページの【連携対象】にチェック\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/5089164688409\n\n---\n\n## Facebook連携\n\n1. 管理画面右上アイコン→【設定】→【店舗】→連携したい店舗を選択\n2. ページ下部の【Facebook連携】→「＋Facebookアカウント追加」をクリック\n3. 1店舗目：連携したいFacebookでログイン\n   - 「現在および今後のページすべてにオプトイン」を選択→「続行」×2\n   - 「保存」をクリック\n4. 2店舗目以降：「Reconnect」をクリック\n5. 「OK」をクリック\n6. ページ下部の【Facebook連携】で連携店舗の【連携対象】にチェック\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/5089193980057\n\n---\n\n## X（旧Twitter）連携\n\n### API制限と連携方式\n\n2023年7月以降、X（旧Twitter）のAPIに制限がかかり、無料アカウントでは30日間のAPI利用によるGBP反映ポスト数が**全社共通で10,000通まで**に制限された。\n\n| 連携方式 | 費用 | 特徴 |\n|---------|------|------|\n| **店舗共通API（無料版）** | 無料 | 全店舗共通のAPIキーを使用。月途中で10,000通超えると制限がかかる可能性あり |\n| **店舗独自のAPI（有料版）** | 有料 | Twitter DeveloperアカウントのBasicプランを契約してAPIキーを発行。月途中制限が発生しにくい |\n\n### X連携手順\n\n1. Dashboardにログイン\n2. 上部メニューから【店舗】を選択→Xを連携したい店舗を選択\n3. 基本情報ページ下部の「Twitter連携」の「＋Twitterアカウント追加」をクリック\n4. 連携方式を選択（無料：店舗共通API / 有料：店舗独自のAPI）\n5. 右上の【X（旧Twitter）アカウント追加】を選択→TwitterアカウントのID・PWを入力\n6. ダッシュボード画面に戻り「Twitter連携」欄にアカウント名が表示されたら完了\n\n⚠️ **連携後の初期設定では（A）GBP投稿→Twitter反映、（B）Twitter投稿→GBP反映 の両方が有効になる。** TwitterをGBPに反映させたくない場合は「TW→GBP投稿」のチェックを外す。\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/5076012112921\n**参照（API仕様）**：https://help-meodash.zendesk.com/hc/ja/articles/25222496698649\n\n---\n\n## Dashboard→SNS+GBP同時投稿\n\nDashboard上からSNS（X/Facebook/Instagram等）とGBPへ同時に投稿できる。\n\n### 手順（イベント投稿の例）\n\n1. 左ナビ【Googleデータ連携】→【Googleビジネスプロフィール】→【投稿】\n2. 右上【新規作成】をクリック\n3. 投稿タイプ：イベント を選択\n4. 以下の項目を設定：\n   - **②媒体**：投稿先のSNS媒体を選択（複数・全選択も可）\n   - **③タイトル**：58文字以内\n   - **④投稿日時**：即時または予約\n   - **⑤開始・終了日時**\n   - **⑥投稿内容**：1500文字以内\n   - **⑦画像**\n   - **⑧ボタン追加**（CTA）\n   - **⑨ハッシュタグ**（半角#で入力）\n5. 「登録する」をクリックして完了\n\n### 各SNSの画像投稿制限\n\n| 媒体 | 投稿可能枚数 |\n|------|------------|\n| Instagram | 1枚のみ |\n| Facebook | 枚数制限なし |\n| X（旧Twitter） | 最大4枚 |\n\n⚠️ Xを選択した場合、イベント開催期間も投稿内容に含まれるため**全角140文字・半角280文字**の制限に注意。\n⚠️ Instagramを選択した場合、画像を選択しないと投稿されない。\n⚠️ SNS側から2枚以上の画像入り投稿をGBPに反映する場合、**1枚目の写真のみ**がGBPに反映される。\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/5149798275353\n\n---\n\n## LINE連携\n\n### 連携手順\n\n**事前準備：** LINE Developersで以下を準備する\n- チャネルID\n- チャネルシークレット\n- あなたのユーザーID\n- チャネルアクセストークン\n\n1. Dashboard TOPページ右上アイコン→【設定】→【店舗】\n2. 連携させたい店舗名をクリック\n3. 詳細ページ中央の「LINE連携」の4つの入力欄に移動\n4. 準備した「チャネルID」「チャネルシークレット」「ユーザーID」「チャネルアクセストークン」を入力\n5. 画面下部の【登録する】をクリックして完了\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/10075930984217\n**参照（事前準備）**：https://help-meodash.zendesk.com/hc/ja/articles/13639501298969\n**参照（LINE Webhook URL設定）**：https://help-meodash.zendesk.com/hc/ja/articles/44131495422361\n**参照（メッセージ配信）**：https://help-meodash.zendesk.com/hc/ja/articles/37312392430873\n\n---\n\n## SNS投稿に関する注意事項\n\n**参照（投稿注意点）**：https://help-meodash.zendesk.com/hc/ja/articles/5245459826073\n**参照（特定キーワード）**：https://help-meodash.zendesk.com/hc/ja/articles/21348670942105\n**参照（運用フロー）**：https://help-meodash.zendesk.com/hc/ja/articles/32446053499801\n",
  "workflow.md": "# ワークフロー（WF）機能\n\n## 情報ソース\n\n| 資料名 | 種別 | 取得日 | 備考 |\n|--------|------|--------|------|\n| MEO Dashboard ワークフロー申請通知メール件名調整 リリース告知 | 仕様変更告知 | 2026-05-25 | リリース予定：2026-05-26 |\n| MEO Dashboard ヘルプセンター（help-meodash.zendesk.com） | 公式ヘルプ | 2026-06-12 | Claude in Chromeで直接参照 |\n\n---\n\n## ワークフロー機能の概要\n\nクチコミ返信・投稿などのコンテンツを送信・公開する前に、承認者の確認・承認を経るフロー機能。承認依頼・却下時にメール通知が送られる。\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/51964474248985\n\n---\n\n## 【個店】ワークフロー申請の手順（申請者）\n\n### 投稿のWF申請\n\n1. 投稿を作成後、画面最下部の「ワークフロー申請」をクリック\n2. 「承認者を選択」を押し、承認者を選択\n3. 承認の種別を「全員の承認」「１名の承認」から選択\n4. 「申請する」を押下\n5. 画面下部の「登録する」を押下して完了\n\n### クチコミ返信のWF申請\n\n1. クチコミ返信を作成後、画面最下部の「ワークフロー申請」をクリック\n2. 「承認者を選択」を押し、承認者を選択\n3. 承認の種別を「全員の承認」「１名の承認」から選択\n4. 「申請する」を押下\n5. 「登録する」を押下\n\n⚠️ 「登録する」を押下しても即時送信はされない。承認者へメールが送られる。\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/4823186275481\n\n---\n\n## 【グループ】ワークフロー申請の手順（申請者）\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/51964271095961\n\n---\n\n## 【個店・グループ】ワークフロー申請の承認方法（承認者）\n\n1. 承認者に以下の件名のメールが届く：\n   - 投稿：「【要承認】[投稿] ワークフロー承認依頼が届いています（店舗マーケティング管理ツール）」\n   - クチコミ返信：「【要承認】[クチコミ返信] ワークフロー承認依頼が届いています（店舗マーケティング管理ツール）」\n2. メール内の「承認画面のリンク」をクリック\n3. WF承認画面で投稿内容を確認し：\n   - 問題なければ【承認】ボタンを押す → 即時投稿される\n   - 問題がある場合はコメントを入力して【却下】ボタンを押す → WF却下される\n\n### 却下された場合\n\n申請者に以下の件名のメールが届く：\n- 「【要修正】[投稿] 申請が却下されました（店舗マーケティング管理ツール）」\n- 「【要修正】[クチコミ返信] 申請が却下されました（店舗マーケティング管理ツール）」\n\n確認URLから内容を修正し、再度ワークフロー申請を行う。\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/51950699029017\n\n---\n\n## 申請通知メール件名（2026-05-26リリース後の仕様）\n\n| 場面 | 種別 | 件名 |\n|------|------|------|\n| 承認依頼 | クチコミ返信 | 【要承認】[クチコミ返信] ワークフロー承認依頼が届いています（店舗マーケティング管理ツール） |\n| 承認依頼 | 投稿 | 【要承認】[投稿] ワークフロー承認依頼が届いています（店舗マーケティング管理ツール） |\n| 却下 | クチコミ返信 | 【要修正】[クチコミ返信] 申請が却下されました（店舗マーケティング管理ツール） |\n| 却下 | 投稿 | 【要修正】[投稿] 申請が却下されました（店舗マーケティング管理ツール） |\n\n---\n\n## WF承認状況の表示\n\nクチコミ管理一覧画面の「WF承認」列に以下のステータスが表示される：\n\n| 表示 | 意味 |\n|------|------|\n| WFなし | ワークフロー承認設定なし |\n| 承認済 | 承認完了 |\n| 却下 | 申請が却下された状態 |\n\n---\n\n## ⚠️ 注意点\n\n- 承認メールの件名に【要承認】【要修正】のプレフィックスが付くことで、受信者がメールの種別を件名だけで判別しやすくなった\n- 顧客に対してWF設定を説明する際は、件名フォーマットも合わせて案内するとよい\n\n\n## 情報ソース\n\n| 資料名 | 種別 | 取得日 | 備考 |\n|--------|------|--------|------|\n| MEO Dashboard ワークフロー申請通知メール件名調整 リリース告知 | 仕様変更告知 | 2026-05-25 | リリース予定：2026-05-26 |\n\n---\n\n## ワークフロー機能の概要\n\nクチコミ返信・投稿などのコンテンツを送信・公開する前に、承認者の確認・承認を経るフロー機能。承認依頼・却下時にメール通知が送られる。\n\n---\n\n## 申請通知メール（2026-05-26リリース後の仕様）\n\n### 承認依頼時のメール件名\n\n| 申請種別 | 件名 |\n|----------|------|\n| クチコミ返信 | 【要承認】[クチコミ返信] ワークフロー承認依頼が届いています（店舗マーケティング管理ツール） |\n| 投稿 | 【要承認】[投稿] ワークフロー承認依頼が届いています（店舗マーケティング管理ツール） |\n\n### 却下時のメール件名\n\n| 申請種別 | 件名 |\n|----------|------|\n| クチコミ返信 | 【要修正】[クチコミ返信] 申請が却下されました（店舗マーケティング管理ツール） |\n| 投稿 | 【要修正】[投稿] 申請が却下されました（店舗マーケティング管理ツール） |\n\n**メール本文は変更なし**（件名のみの変更）。\n\n### 改修理由\n\n社内要望。\n\n---\n\n## WF承認状況の表示\n\nクチコミ管理一覧画面の「WF承認」列に以下のステータスが表示される：\n\n| 表示 | 意味 |\n|------|------|\n| WFなし | ワークフロー承認設定なし |\n| 承認済 | 承認完了 |\n| 却下 | 申請が却下された状態 |\n| （承認待ち等） | 詳細は追加情報収録後に更新 |\n\n---\n\n## ⚠️ 注意点\n\n- 承認メールの件名に【要承認】【要修正】のプレフィックスが付くことで、受信者がメールの種別を件名だけで判別しやすくなった\n- 顧客に対してWF設定を説明する際は、件名フォーマットも合わせて案内するとよい\n",
  "yext-integration.md": "# Yext連携\n\n## 情報ソース\n\n| 資料名 | 種別 | 取得日 | 備考 |\n|--------|------|--------|------|\n| MEO Dashboard Yext連携（追加項目）PPTX | 操作マニュアル・仕様資料 | 2026-05-25 | 資料作成日：2026-05-07 リリース日：2026-05-08 |\n| MEO Dashboard Yext連携 リリース共有 | リリース共有 | 2026-05-25 | リリース日：2026-05-08 |\n| MEO Dashboard ヘルプセンター（help-meodash.zendesk.com） | 公式ヘルプ | 2026-06-12 | Claude in Chromeで直接参照（Yext新着記事含む） |\n\n---\n\n## 概要\n\nMEO DashboardとYextは連携しており、MEO Dashboard上で情報を更新すると、Yextへデータが送信される。Yext側でのリスティング配信はYextスキル（`yext-knowledgebase-by-gmo`）を参照。\n\n**連携の方向**：MEO Dashboard → Yext（一方向）\n\n⚠️ **オプション機能。** ご希望の場合は担当まで連絡。\n\n---\n\n## Yextとは\n\nYextの接続可能な各Map系メディア・検索エンジン・地図アプリ・SNS・口コミサイト・スマートスピーカー等に店舗情報を正しく反映し自動連携・掲載するプラットフォーム。「情報の一元管理」により、一度の操作で複数プラットフォームへ情報が更新される。\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/51672707057945\n\n---\n\n## Yext連携の初期設定手順\n\n1. 個別店舗画面より【Googleデータ連携】→【Googleビジネスプロフィール】→【店舗基本情報】を選択\n2. 画面左上の【Yext】に☑を入れる\n3. 画面下の【登録する】を押す\n\n→ MEO Dashboard上の基本情報がYextを通じて各パブリッシャーに送信される。以降、基本情報を編集した場合もYext連携がONの状態であれば自動的に情報が更新される。\n\n**同期状況の確認：** 左メニュー【Yext】→【すべてのリスティング】で各パブリッシャーとの連携状況を確認できる。\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/44332119544857\n\n---\n\n## MEO DashboardからYextへ連携される基本情報項目\n\n| 連携対象項目 |\n|------------|\n| 店舗名 |\n| 住所（郵便番号・都道府県を含む） |\n| 電話番号 |\n| WEBサイトURL（メニュー／予約リンク） |\n| メインカテゴリー／サブカテゴリー |\n| 営業時間 |\n| ビジネス情報 |\n\n⚠️ **電話番号の記載がない店舗情報は、MEO DashboardとYextの連携ができない。**\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/55238762003609\n\n---\n\n## MEO Dashboard → Yext 連携項目一覧\n\n### 2026-05-08リリース追加前から連携済みの項目\n\n（基本マニュアル未収録のため詳細不明。追加資料収録後に更新予定）\n\n---\n\n### 2026-05-08リリース追加の5項目\n\n| No. | 追加項目 | MEO Dashboard側の操作・項目 | Yext側の反映先 | 備考 |\n|-----|---------|--------------------------|--------------|------|\n| 1 | 休日営業時間 | 店舗基本情報の「特別営業時間」を更新 | Yext「営業時間（休日営業時間）」 | — |\n| 2 | SNSユーザー名（Instagram） | 店舗基本情報の「Instagram」を更新 | Yext「ソーシャルメディア」Instagram欄 | — |\n| 2 | SNSユーザー名（X） | 店舗基本情報の「X」を更新 | Yext「ソーシャルメディア」X欄 | — |\n| 2 | SNSユーザー名（Facebook） | 店舗基本情報の「Facebook」を更新 | Yext「ソーシャルメディア」Facebook欄 | — |\n| 3 | 設立年 | 店舗基本情報の「開業日」を更新 | Yext「設立年」 | Yextは**年のみ**の表示。日付情報は送信されない |\n| 4 | 対応言語 | 店舗基本情報の「言語サポート」を更新 | Yext「言語」 | Yextに言語登録済みの場合は**追加処理**（上書きではない） |\n| 5 | キーワード | 店舗詳細画面の「キーワード設定（Google）」を更新 | Yext「キーワード」 | Yextにキーワード登録済みの場合は**追加処理**（上書きではない） |\n\n---\n\n## ⚠️ 注意点\n\n- **設立年**：MEO Dashboard側では「開業日」（年月日）で管理しているが、Yextへの送信は「年」のみ。月・日の情報はYextに送信されない\n- **対応言語・キーワード**：Yextにすでに登録がある場合、MEO Dashboardからのデータは**追加**される（既存データは削除されない）。上書きではないため、Yext側にMEO Dashboardと異なるデータが残る可能性がある\n- Yext連携はMEO Dashboard → Yextの一方向。Yext側での変更がMEO Dashboardに反映されることはない\n\n---\n\n## 媒体側での店舗情報変更時のYext上書き仕様（2026-06-04 新着記事）\n\n### 基本的な動作\n\n媒体側（各パブリッシャー）で店舗情報を修正し、Yext管理画面上の情報を変更しなかった場合、Yextは管理画面上の情報を正として各パブリッシャーへ継続的に同期を行う。\n\n→ **媒体側の情報とYext上の情報に差分がある場合、同期のタイミングでYextの情報が再度媒体側へ反映される。**\n\n### 例外・注意事項\n\n- パブリッシャー側の仕様によっては、一部項目がロックされている場合や、API経由の更新が反映されない場合がある\n- すべての項目が必ずYextの情報で上書きされるわけではない\n- 最終的な表示内容は各パブリッシャーの仕様や判断に依存する\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/58619489490201\n\n---\n\n## 各媒体側での店舗情報変更時の通知機能（2026-06-04 新着記事）\n\n各種媒体側で直接店舗情報を変更した場合の通知機能（メール通知等）は、**現時点ではYextにおいて提供されていない。**\n\n→ 各媒体側で行われた情報変更について、Yextから自動的に通知されることはない。\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/58619182630553\n\n---\n\n## MEO DashboardのYext写真連携機能\n\nMEO Dashboard の店舗基本情報ページ上の「Yext連携」にチェックが入っている場合、写真管理ページに登録された画像をYextへ送信できる。\n\n**対象：** 「事業ロゴ」および「写真（Google）」\n\n### 写真（Google）の連携方法\n\n1. 店舗基本情報ページで「Yext連携」にチェックを入れる\n2. 写真管理ページに「Yext写真連携」ボタンが表示される\n3. 「Yext写真連携」ボタンをクリックすると「Google画像ライブラリ」が表示される\n4. 任意の写真を**最大50枚まで**選択してYextへ送信\n\n**Yext管理画面上の反映先：** 事業ロゴと写真ギャラリーに写真が追加される\n\n### 連携の解除方法\n\n該当写真のチェックを外して「登録する」をクリック。\n\n⚠️ Yextと連携中の写真には識別としてYextマークが表示される。\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/58107534491545\n\n---\n\n## YEXT連携対象外パブリッシャー\n\n以下のパブリッシャーはYext連携の対象外。MEO Dashboard上の「すべてのリスティング」において「同期していません」と表示される。\n\n- Waze\n- Google Business Profile\n- Instagram\n- Facebook\n- Gemini\n\n⚠️ TripAdvisorのご登録がお済みの場合は、GMO TECHにてYextとTripAdvisorのページを連携する。店舗名とTripAdvisorのページURLがわかるリストを共有する必要がある。\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/44332119544857\n\n---\n\n## 同期の強制\n\nYext上に登録されている最新の情報を各パブリッシャーへ再度送信する機能。\n\n**参照**：https://help-meodash.zendesk.com/hc/ja/articles/56985060166425\n"

function getTitle(content) {
  const m = content.match(/^#\s+(.+)/m);
  return m ? m[1] : '（タイトルなし）';
}

function getSections(content) {
  return (content.match(/^##\s+/mg) || []).length;
}

function getPreview(content) {
  const lines = content.split('\n').filter(l => l.trim() && !l.startsWith('#') && !l.startsWith('|') && !l.startsWith('-'));
  return lines.slice(0, 2).join(' ').slice(0, 80) + (lines.length > 2 ? '…' : '');
}

// Build nav
const nav = document.getElementById('nav');
Object.keys(FILES).forEach(name => {
  const content = FILES[name];
  const title = getTitle(content);
  const sections = getSections(content);
  const div = document.createElement('div');
  div.className = 'nav-item';
  div.dataset.file = name;
  div.innerHTML = (ICONS[name] || '📄') + ' ' + title.replace(/（.*?）/, '') + 
    (sections > 0 ? '<span class="badge">' + sections + '</span>' : '');
  div.onclick = () => showFile(name);
  nav.appendChild(div);
});

// Build overview grid
function showOverview() {
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.file === '__overview__');
  });
  document.getElementById('topbar-title').textContent = '概要 - 全リファレンス';
  document.getElementById('breadcrumb').textContent = 'MEO Dashboard / references';
  document.getElementById('overview-grid').style.display = 'grid';
  document.getElementById('md-content').style.display = 'none';
  document.getElementById('back-btn').style.display = 'none';

  const grid = document.getElementById('overview-grid');
  grid.innerHTML = '';
  Object.keys(FILES).forEach(name => {
    const content = FILES[name];
    const title = getTitle(content);
    const sections = getSections(content);
    const preview = getPreview(content);
    const lines = content.split('\n').length;
    const card = document.createElement('div');
    card.className = 'overview-card';
    card.innerHTML = '<div class="icon">' + (ICONS[name] || '📄') + '</div>' +
      '<h3>' + title + '</h3>' +
      '<p>' + (preview || '（内容なし）') + '</p>' +
      '<div class="lines">セクション数: ' + sections + ' ／ 行数: ' + lines + '</div>';
    card.onclick = () => showFile(name);
    grid.appendChild(card);
  });
}

function showFile(name) {
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.file === name);
  });

  const content = FILES[name];
  const title = getTitle(content);

  document.getElementById('topbar-title').textContent = title;
  document.getElementById('breadcrumb').textContent = 'MEO Dashboard / references / ' + name;
  document.getElementById('overview-grid').style.display = 'none';
  document.getElementById('back-btn').style.display = 'inline-block';

  const mdEl = document.getElementById('md-content');
  mdEl.style.display = 'block';
  mdEl.innerHTML = marked.parse(content || '（内容なし）');

  document.getElementById('content-area').scrollTop = 0;
}

// Search
document.getElementById('search-input').addEventListener('input', function() {
  const q = this.value.toLowerCase();
  document.querySelectorAll('#nav .nav-item[data-file]').forEach(el => {
    if (el.dataset.file === '__overview__') return;
    const match = el.textContent.toLowerCase().includes(q) ||
      getTitle(FILES[el.dataset.file] || '').toLowerCase().includes(q);
    el.style.display = (q === '' || match) ? 'block' : 'none';
  });
});

// Init
showOverview();
</script>
